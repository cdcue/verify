  const t = el('div', {className: 'toast', role: 'status', textContent: msg});
  document.body.append(t);
  setTimeout(() => t.remove(), 2200);
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) { /* private browsing */ }
  const t = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(n => { n.textContent = t[n.dataset.t]; });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === l)));
  $('org').textContent = $('orgFoot').textContent = ORG[l] || ORG.fr;
  $('langField').value = l;
  document.title = t.platform + ' · ' + (ORG[l] || ORG.fr);
  if (last) render(last);
}

function head(kind, title, text) {
  return el('div', {className: 'status ' + kind}, el('div', {className: 'icon'}, svg(ICON[kind === 'lock' ? 'lock' : kind])),
            el('div', {}, el('h2', {textContent: title}), text ? el('p', {textContent: text}) : null));
}
function details(row, full) {
  const t = T[lang], dl = el('dl');
  const add = (label, value, wide, cls) => value && dl.append(pair(label, cls ? el('span', {className: cls, textContent: value}) : value, wide));
  add(t.fSerial, row.serial, false, 'serial ltr');
  add(t.fName, row.name);
  add(t.fActivity, row.activity, true);
  add(t.fDates, row.dates);
  add(t.fOrg, row.org);
  if (full) { add(t.fType, row.type); add(t.fIssued, fmtDate(row.issued)); }
  return dl;
}
function pair(label, value, wide) {  // one label over its value; pairs flow in one or two columns
  return el('div', {className: wide ? 'wide' : ''}, el('dt', {textContent: label}), el('dd', {dir: 'auto'}, value));
}
function linkedin(row) {
  const d = new Date(row.issued), here = location.origin + location.pathname;
  const q = {startTask: 'CERTIFICATION_NAME', name: row.type + ' — ' + row.activity, organizationName: row.org,
             issueYear: d.getFullYear() || '', issueMonth: (d.getMonth() + 1) || '',
             certUrl: here + '?s=' + encodeURIComponent(row.serial) + (code ? '&k=' + encodeURIComponent(code) : ''), certId: row.serial};
  return 'https://www.linkedin.com/profile/add?' + new URLSearchParams(q);
}
function shareLink() {
  const url = location.origin + location.pathname + '?s=' + encodeURIComponent(serial) + (code ? '&k=' + encodeURIComponent(code) : '');
  if (navigator.share) return navigator.share({title: T[lang].okT, url}).catch(() => {});
  navigator.clipboard.writeText(url).then(() => toast(T[lang].copied), () => prompt('', url));
}

function render(r) {
  const t = T[lang], box = $('result'), row = r && r.row;
  box.replaceChildren();
  $('steps').hidden = !!r;
  if (r === 'error') {
    const card = el('div', {className: 'card result'}, head('bad', t.errT, t.errD));
    card.append(el('div', {className: 'body', style: 'grid-template-columns:1fr'},
      el('button', {className: 'btn ghost', type: 'button', textContent: t.retry, onclick: lookup})));
    return box.append(card);
  }
  if (!row) return box.append(el('div', {className: 'card result'}, head('bad', t.noT, t.noD)));
  if (row.revoked) {
    const card = el('div', {className: 'card result'}, head('bad', t.revT, t.revD));
    const dl = el('dl', {}, pair(t.fSerial, el('span', {className: 'serial ltr', textContent: row.serial})), pair(t.reason, row.revoked));
    card.append(el('div', {className: 'body', style: 'grid-template-columns:1fr'}, dl));
    return box.append(card);
  }
  if (r.locked) {
    $('codebox').hidden = false;
    $('form').classList.add('withcode');
    const card = el('div', {className: 'card result'}, head('lock', t.okT, t.lockD));
    card.append(el('div', {className: 'body', style: 'grid-template-columns:1fr'}, details(row, false)), el('p', {className: 'note', textContent: t.masked}));
    return box.append(card);
  }
  const side = el('div', {className: 'side'});
  if (/^https:\/\//.test(row.link)) side.append(el('a', {className: 'btn', href: row.link, target: '_blank', rel: 'noopener', textContent: t.download}));
  side.append(el('a', {className: 'btn li', href: linkedin(row), target: '_blank', rel: 'noopener', textContent: t.linkedin}),
              el('button', {className: 'btn ghost', type: 'button', textContent: t.share, onclick: shareLink}),
              el('button', {className: 'btn ghost', type: 'button', textContent: t.print, onclick: () => print()}),
              el('div', {className: 'stamp'}, el('b', {textContent: t.stampT}),
                 t.stampD + ' ' + new Intl.DateTimeFormat(LOCALE[lang], {dateStyle: 'medium', timeStyle: 'short'}).format(new Date())));
  box.append(el('div', {className: 'card result'}, head('ok', t.okT, t.okD), el('div', {className: 'body'}, details(row, true), side)));
}

function lookup() {
  last = null;
  $('steps').hidden = true;
  $('result').replaceChildren(el('div', {className: 'card result', 'aria-busy': 'true'},
    el('div', {className: 'skeleton'}, el('i', {style: 'width:40%'}), el('i', {style: 'width:85%'}), el('i', {style: 'width:65%'}),
       el('span', {className: 'hint', textContent: T[lang].loading}))));
  // credentials 'omit': no Google cookies are sent, so Google treats every visitor alike, whatever accounts they use
  fetch(API + '?api=1&s=' + encodeURIComponent(serial) + '&k=' + encodeURIComponent(code), {credentials: 'omit'})
    .then(res => res.json())
    .then(r => { last = r; render(r); })
    .catch(() => { last = 'error'; render('error'); });
}

document.querySelector('.langs').addEventListener('click', e => { if (e.target.dataset.lang) setLang(e.target.dataset.lang); });
$('form').addEventListener('submit', e => {
  if (!$('s').value.trim()) { e.preventDefault(); $('s').focus(); }
  if (!$('k').value.trim()) $('k').disabled = true;  // no empty "&k=" in the address
});
if (LOGO) { $('logo').src = LOGO; $('logo').hidden = false; $('seal').hidden = true; }
$('year').textContent = new Date().getFullYear();
$('s').value = serial;
$('k').value = code;
setLang(lang);
if (serial) lookup();
</script>
</body>
</html>
