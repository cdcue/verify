<style>

  .search .say { grid-column: 1 / -1; }

  @media (min-width: 720px) {
    .search { grid-template-columns: 1fr auto; align-items: end; padding: 24px; }
    .search.withcode { grid-template-columns: 1.4fr 1fr auto; }
    .search .hint { grid-column: 1 / -1; }
  }
  .result { margin-top: 18px; overflow: hidden; }
  .status { display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .status .icon { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .status p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
  .ok .icon { background: var(--ok-soft); color: var(--ok); } .ok h2 { color: var(--ok); }
  .lock .icon { background: var(--warn-soft); color: var(--warn); } .lock h2 { color: var(--ok); }
  .bad .icon { background: var(--err-soft); color: var(--err); } .bad h2 { color: var(--err); }
  .body { padding: 20px; display: grid; gap: 20px; }

  dl { margin: 0; display: grid; grid-template-columns: 1fr; gap: 14px 24px; }
  @media (min-width: 560px) { dl { grid-template-columns: 1fr 1fr; } }
  dt { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  dd { margin: 2px 0 0; font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
  [dir="ltr"] dd { text-align: left; } [dir="rtl"] dd { text-align: right; }  /* values keep their own direction, aligned with the page */
  dl .wide { grid-column: 1 / -1; }
  .side { display: flex; flex-direction: column; gap: 10px; }
  .side .btn { width: 100%; }
  .stamp { border: 1.5px dashed var(--gold); border-radius: 14px; padding: 14px; text-align: center; color: var(--muted); font-size: 13px; background: var(--gold-soft); }

      <label class="btn ghost" for="file"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6"/></svg><span data-t="fileBtn"></span></label>

  </section>
</main>

};
const ICON = {
  ok: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l7 3v6c0 5-3.4 8.6-7 10-3.6-1.4-7-5-7-10V5l7-3z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>',

  bad: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
};

const {el, svg, t} = UI, $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const serial = (params.get('s') || '').trim().toUpperCase(), code = (params.get('k') || '').trim().toUpperCase();
let last = null;  // the latest answer, drawn again when the language changes

function head(kind, title, text) {
  return el('div', {className: 'status ' + kind}, el('div', {className: 'icon'}, svg(ICON[kind])),
            el('div', {}, el('h2', {textContent: title}), text ? el('p', {textContent: text}) : null));
}
function pair(label, value, wide) {  // one label over its value; pairs flow in one or two columns
  return el('div', {className: wide ? 'wide' : ''}, el('dt', {textContent: label}), el('dd', {dir: 'auto'}, value));
}
function details(row, full) {
  const dl = el('dl');
  const add = (label, value, wide, cls) => value && dl.append(pair(label, cls ? el('span', {className: cls, textContent: value}) : value, wide));
  add(t('fSerial'), row.serial, false, 'serial ltr');
  add(t('fName'), row.name);
  add(t('fActivity'), row.activity, true);
  add(t('fDates'), row.dates);
  add(t('fOrg'), row.org);
  if (full) { add(t('fType'), row.type); add(t('fIssued'), UI.fmtDate(row.issued)); }
  return dl;
}
function shareLink() {
  const url = location.origin + location.pathname + '?s=' + encodeURIComponent(serial) + (code ? '&k=' + encodeURIComponent(code) : '');
  if (navigator.share) return navigator.share({title: t('okT'), url}).catch(() => {});
  navigator.clipboard.writeText(url).then(() => UI.toast(t('copied')), () => prompt('', url));
}
const card = (...kids) => el('div', {className: 'card result rise'}, ...kids);
const one = (...kids) => el('div', {className: 'body', style: 'grid-template-columns:1fr'}, ...kids);

function render(r) {
  const box = $('result'), row = r && r.row;
  box.replaceChildren();
  $('steps').hidden = !!r;
  if (r === 'error') return box.append(card(head('bad', t('errT'), t('errD')), one(el('button', {className: 'btn ghost', type: 'button', textContent: t('retry'), onclick: lookup}))));
  if (!row) return box.append(card(head('bad', t('noT'), t('noD'))));
  if (row.revoked) {
    return box.append(card(head('bad', t('revT'), t('revD')),
      one(el('dl', {}, pair(t('fSerial'), el('span', {className: 'serial ltr', textContent: row.serial})), pair(t('reason'), row.revoked)))));
  }
  if (r.locked) {
    $('codebox').hidden = false;
    $('form').classList.add('withcode');
    return box.append(card(head('lock', t('okT'), t('lockD')), one(details(row, false)), el('p', {className: 'note', textContent: t('masked')})));
  }
  const side = el('div', {className: 'side'});
  if (/^https:\/\//.test(row.link)) side.append(el('a', {className: 'btn', href: row.link, target: '_blank', rel: 'noopener', textContent: t('download')}));
  side.append(el('button', {className: 'btn ghost', type: 'button', textContent: t('share'), onclick: shareLink}),
              el('button', {className: 'btn ghost', type: 'button', textContent: t('print'), onclick: () => print()}),
              el('div', {className: 'stamp'}, el('b', {textContent: t('stampT')}),
                 t('stampD') + ' ' + UI.fmtDate(new Date(), {dateStyle: 'medium', timeStyle: 'short'})));
  box.append(card(head('ok', t('okT'), t('okD')), el('div', {className: 'body'}, details(row, true), side)));
}

function lookup() {
  last = null;
  $('steps').hidden = true;
  $('result').replaceChildren(el('div', {className: 'card result', ariaBusy: 'true'},
    el('div', {className: 'skeleton'}, el('i', {style: 'width:40%'}), el('i', {style: 'width:85%'}), el('i', {style: 'width:65%'}),
       el('span', {className: 'hint', textContent: t('loading')}))));
  // credentials 'omit': no Google cookies are sent, so Google treats every visitor alike, whatever accounts they use
  fetch(API + '?api=1&s=' + encodeURIComponent(serial) + '&k=' + encodeURIComponent(code), {credentials: 'omit'})
    .then(res => res.json())
    .then(r => { last = r; render(r); })
    .catch(() => { last = 'error'; render('error'); });
}

function open_(text) {  // a certificate's code read somewhere: its number (and code) go to the address, as if typed
  let s_ = '', k_ = '';
  try {
    const u = new URL(String(text).trim());
    s_ = u.searchParams.get('s') || ''; k_ = u.searchParams.get('k') || '';
  } catch (e) { if (/^[A-Z]{2,10}-\d{4,6}-[A-Z]?\d{2,6}$/i.test(String(text).trim())) s_ = String(text).trim(); }
  if (!s_) { $('readSay').textContent = t('notCert'); return false; }
  const q = new URLSearchParams({s: s_.toUpperCase(), lang: UI.lang});
  if (k_) q.set('k', k_.toUpperCase());
  location.search = '?' + q;
  return true;
}
let det, stream = null, ctx = null;
const canvas = document.createElement('canvas');
async function decodeIn(src, w, h) {  // a QR code in a video frame or a picture: the phone's own reader, else jsQR
  if (det === undefined) {
    det = null;
    try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) det = new BarcodeDetector({formats: ['qr_code']}); } catch (e) { /* none */ }
  }
  if (det) { try { const c = await det.detect(src); if (c.length) return c[0].rawValue; } catch (e) { det = null; } }
  if (!window.jsQR) return null;
  const k = Math.min(1, 1400 / Math.max(w, h)), cw = Math.round(w * k), ch = Math.round(h * k);
  canvas.width = cw; canvas.height = ch;
  ctx = canvas.getContext('2d', {willReadFrequently: true});
  ctx.drawImage(src, 0, 0, cw, ch);
  const r = jsQR(ctx.getImageData(0, 0, cw, ch).data, cw, ch, {inversionAttempts: 'attemptBoth'});
  return r ? r.data : null;
}
function camOff() {
  if (stream) stream.getTracks().forEach(tr => tr.stop());
  stream = null;
  $('camDlg').open && $('camDlg').close();
}
$('camBtn').onclick = async () => {
  $('readSay').textContent = '';
  const video = document.querySelector('#camDlg video');
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}}});
  } catch (e) { $('readSay').textContent = t('noCam'); return; }
  video.srcObject = stream;
  $('camDlg').showModal();
  await video.play();
  const tick = async () => {
    if (!stream) return;
    const v = video.readyState >= 2 && await decodeIn(video, video.videoWidth, video.videoHeight);
    if (v) { if (open_(v)) return camOff(); }
    setTimeout(tick, 120);
  };
  tick();
};
$('camClose').onclick = camOff;
$('camDlg').addEventListener('close', camOff);
$('file').onchange = async () => {
  const f = $('file').files[0];
  $('file').value = '';
  if (!f) return;
  $('readSay').textContent = '';
  if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {  // the link the platform puts on the code in the PDF
    const raw = new TextDecoder('latin1').decode(await f.arrayBuffer());
    const m = raw.match(/\/URI\s*\((https:[^)]*[?&]s=[^)]*)\)/);
    if (!(m && open_(m[1]))) $('readSay').textContent = t('oldPdf');
    return;
  }
  try {
    const img = await createImageBitmap(f);
    const v = await decodeIn(img, img.width, img.height);
    if (!(v && open_(v))) $('readSay').textContent = t(v ? 'notCert' : 'noQr');
  } catch (e) { $('readSay').textContent = t('noQr'); }
};

$('form').addEventListener('submit', e => {
  if (!$('s').value.trim()) { e.preventDefault(); $('s').focus(); }
  if (!$('k').value.trim()) $('k').disabled = true;  // no empty "&k=" in the address
});
$('s').value = serial;
$('k').value = code;
UI.init({page: 'verify', name: 'title', T, onLang: l => { $('langField').value = l; if (last) render(last); }});
if (serial) lookup();
</script>
