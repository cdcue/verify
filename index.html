<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>التحقق من الشواهد · Vérification</title>
<style>
  body { margin:0; font-family:"Segoe UI", Tahoma, sans-serif; background:#f5f6f8; color:#1d2433; }
  .box { max-width:520px; margin:40px auto; background:#fff; border:1px solid #e3e6ec; border-radius:12px; padding:24px; }
  @media (max-width:560px) { .box { margin:16px; } }
  h1 { font-size:20px; margin:0 0 16px; }
  input { width:100%; box-sizing:border-box; padding:10px; font-size:16px; border:1px solid #ccd; border-radius:8px; direction:ltr; }
  button, a.btn { display:inline-block; margin-top:12px; background:#0f5bd8; color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:15px; text-decoration:none; cursor:pointer; }
  .ok { border-right:4px solid #137a3e; padding:4px 14px; margin-top:20px; }
  .no { color:#b42318; margin-top:20px; }
  .muted { color:#667085; font-size:14px; }
  dt { color:#667085; font-size:13px; margin-top:8px; } dd { margin:0; font-weight:600; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div class="box">
  <h1>التحقق من صحة الشهادة · Vérification</h1>
  <form method="get">
    <input name="s" id="s" placeholder="CDCUE-2026-P0001" autocomplete="off">
    <input name="k" id="k" placeholder="رمز التحقق · Code" style="margin-top:8px" autocomplete="off" hidden>
    <button>تحقق · Vérifier</button>
  </form>
  <p class="muted" id="wait" hidden>جارٍ التحقق... · Vérification...</p>
  <div id="out"></div>
</div>
<script>
// the Apps Script web app (its /exec address): only the data comes from Google, read without any Google account
const API = 'https://script.google.com/macros/s/AKfycbyhQdedASgHUcB7vIZ6mAtgzy1fo6TFTa0bGybYmjnnU5JV79VRCzwudv8wMSJnL71i/exec';

const params = new URLSearchParams(location.search);
const serial = (params.get('s') || '').trim().toUpperCase(), code = (params.get('k') || '').trim().toUpperCase();
const out = document.getElementById('out');
document.getElementById('s').value = serial;

function el(tag, attrs, ...kids) {  // builds elements with text only: registry values are never read as HTML
  const e = Object.assign(document.createElement(tag), attrs || {});
  kids.forEach(k => e.append(k));
  return e;
}
function details(row, full) {
  const pairs = [['رقم الشهادة', row.serial], ['الاسم', row.name], ['النشاط', row.activity + (row.dates ? ' — ' + row.dates : '')],
                 ['الجهة المنظمة', row.org]];
  if (full) pairs.push(['نوع الشهادة', row.type], ['تاريخ الإصدار', row.issued]);
  const dl = el('dl');
  pairs.forEach(([t, v], i) => dl.append(el('dt', {textContent: t}), el('dd', {textContent: v || '', dir: i ? 'auto' : 'ltr'})));
  return dl;
}
function linkedin(row) {
  const d = new Date(row.issued), here = location.origin + location.pathname;
  const q = {startTask: 'CERTIFICATION_NAME', name: row.type + ' — ' + row.activity, organizationName: row.org,
             issueYear: d.getFullYear() || '', issueMonth: (d.getMonth() + 1) || '',
             certUrl: here + '?s=' + encodeURIComponent(row.serial) + (code ? '&k=' + encodeURIComponent(code) : ''), certId: row.serial};
  return 'https://www.linkedin.com/profile/add?' + new URLSearchParams(q);
}
function show(r) {
  const row = r.row;
  if (!row) {
    out.append(el('p', {className: 'no', textContent: '✘ لا توجد شهادة بهذا الرقم · Aucune attestation avec ce numéro'}));
  } else if (row.revoked) {
    const box = el('div', {className: 'ok', style: 'border-color:#b42318'},
      el('p', {className: 'no', style: 'margin:0', textContent: '✘ شهادة ملغاة · Attestation annulée'}));
    box.append(el('dl', {}, el('dt', {textContent: 'رقم الشهادة'}), el('dd', {textContent: row.serial, dir: 'ltr'}),
                            el('dt', {textContent: 'السبب'}), el('dd', {textContent: row.revoked})));
    out.append(box);
  } else if (r.locked) {
    document.getElementById('k').hidden = false;
    document.getElementById('k').value = code;
    out.append(el('div', {className: 'ok'}, el('p', {textContent: '✔ شهادة صحيحة · Attestation authentique'}), details(row, false),
      el('p', {className: 'muted', textContent: 'للاطلاع على الشهادة كاملة وتحميلها: امسح رمز QR الموجود عليها، أو أدخل رمز التحقق أعلاه. · ' +
        "Pour l'attestation complète : scannez son code QR ou saisissez le code de vérification."})));
  } else {
    const box = el('div', {className: 'ok'}, el('p', {textContent: '✔ شهادة صحيحة · Attestation authentique'}), details(row, true));
    if (/^https:\/\//.test(row.link)) box.append(el('a', {className: 'btn', href: row.link, textContent: 'تحميل الشهادة · Télécharger'}), ' ');
    box.append(el('a', {className: 'btn', style: 'background:#0a66c2', href: linkedin(row), target: '_blank', rel: 'noopener',
                        textContent: 'أضف إلى LinkedIn'}));
    out.append(box);
  }
}

if (serial) {
  const wait = document.getElementById('wait');
  wait.hidden = false;
  // credentials 'omit': no Google cookies are sent, so Google treats every visitor alike, whatever accounts they use
  fetch(API + '?api=1&s=' + encodeURIComponent(serial) + '&k=' + encodeURIComponent(code), {credentials: 'omit'})
    .then(res => res.json())
    .then(show)
    .catch(() => out.append(el('p', {className: 'no', textContent: 'تعذر الاتصال، أعد المحاولة بعد لحظات · Connexion impossible, réessayez.'})))
    .finally(() => { wait.hidden = true; });
}
</script>
</body>
</html>
