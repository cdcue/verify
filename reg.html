<style>
  .narrow { max-width: 560px; margin: 0 auto; }
  .card.pad { padding: 18px; }
  .fld { display: grid; gap: 6px; margin-bottom: 12px; }
  .fld > span { font-weight: 600; font-size: 14.5px; }
  .fld small { color: var(--muted); font-size: 12.5px; }
  .grid2 { display: grid; gap: 0 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); }
  .opts label { display: flex; gap: 10px; align-items: center; font-weight: 500; min-height: 50px; padding: 10px 14px; border: 1.5px solid var(--line);
    border-radius: 12px; background: var(--surface-2); cursor: pointer; transition: border-color .15s, background .15s; }
  .opts label:has(input:checked) { border-color: var(--brand-2); background: color-mix(in srgb, var(--brand-2) 14%, var(--surface-2)); }
  .opts input { width: 20px; height: 20px; margin: 0; padding: 0; flex: none; accent-color: var(--brand-2); box-shadow: none; }  /* not the text boxes' size */
  .fld select, .fld textarea { width: 100%; min-height: 52px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--ink); font: inherit; padding: 10px 14px; }
  .req { color: var(--err); }
  .hp { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); opacity: 0; pointer-events: none; }  /* for robots only (never off to a side: an RTL page would scroll to it) */
  .ticket { text-align: center; }
  .ticket .qr { background: #fff; display: inline-block; padding: 12px; border-radius: 14px; line-height: 0; margin: 10px 0; }
  .ticket .qr img { width: min(260px, 70vw); height: auto; image-rendering: pixelated; }
  .ticket .num { font: 700 34px/1.2 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 2px; direction: ltr; }
  .ticket .name { font-size: 20px; font-weight: 700; margin: 4px 0; }
  .state { font-size: 13.5px; color: var(--muted); margin: 6px 0 12px; }
  .state.ok { color: var(--ok); } .state.wait { color: var(--gold); }
  .here .tick { width: 76px; height: 76px; border-radius: 50%; background: var(--ok); color: #fff; font: 700 42px/76px system-ui, sans-serif; margin: 8px auto 12px; animation: pop .45s ease-out; }
  .here h2 { margin: 0 0 6px; color: var(--ok); } .here .act { font-weight: 700; margin: 10px 0 2px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .here .tick { animation: none; } }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
  .saved img { max-width: 100%; border-radius: 12px; margin-top: 10px; border: 1px solid var(--line); }
  .others { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .others button { min-height: 34px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
  .others button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
  .desc { white-space: pre-line; color: var(--muted); font-size: 14px; margin: 0 0 12px; }
</style>
</head>
<body>
<header class="top">

<script>
const T = {
  ar: {title: 'التسجيل في النشاط', lead: 'سجّل، واحتفظ برمز حضورك: يُمسح عند نهاية النشاط.', loading: 'جارٍ التحميل...', net: 'تعذر الاتصال بالإنترنت', retry: 'الخادم مشغول أو الاتصال ضعيف، نعيد المحاولة تلقائياً...',
       bad: 'هذا التسجيل غير متاح. إن كان النشاط جديداً فأعد فتح الرابط بعد دقيقة، وإلا فاطلب الرابط من المنظمين.', closed: 'التسجيل في هذا النشاط مغلق.', send: 'تسجيل',
       male: 'ذكر', female: 'أنثى', required: 'هذه الخانة إلزامية', badEmail: 'البريد غير صحيح', yourCode: 'رمز حضورك',
       show: 'أظهر هذا الرمز للمنظمين عند نهاية النشاط. إن تعذّر مسحه، أعطهم رقم التسجيل.', number: 'رقم التسجيل',
       confirmed: 'التسجيل مؤكَّد ✓', pending: 'الرمز صالح. يُرسَل التسجيل إلى المنصة... (يكتمل وحده عند عودة الاتصال)', again: 'كنت مسجّلاً من قبل: هذا رمزك نفسه.',
       saveImg: 'حفظ كصورة في الهاتف', longPress: 'إن لم تُحفظ الصورة تلقائياً: اضغط عليها مطولاً واختر «حفظ الصورة».', another: 'تسجيل شخص آخر من هذا الهاتف',
       already: 'سجّلت من قبل في هذا النشاط؟ استرجع رمزك', findT: 'استرجاع رمز الحضور', findPhone: 'رقم الهاتف الذي سجّلت به', findFirst: 'اسمك الشخصي',
       find: 'استرجاع', notFound: 'لم نجد تسجيلاً بهذا الهاتف والاسم في هذا النشاط.', busy: 'طلبات كثيرة الآن، أعد المحاولة بعد قليل.', back: 'رجوع',
       mine: 'التسجيلات من هذا الهاتف:', here: 'تم تأكيد حضورك', hereIn: 'تم تأكيد حضورك في الحصة {n} من {m}', hereThanks: 'شكراً لحضورك. تصلك شهادتك على بريدك الإلكتروني عند صدورها.', hereNext: 'يظهر رمزك هنا من جديد في الحصة القادمة.', showMine: 'إظهار رمزي', nameMissing: 'اكتب الاسم على الأقل'},
  fr: {title: 'Inscription à l’activité', lead: 'Inscrivez-vous et gardez votre code de présence : il est scanné à la fin.', loading: 'Chargement...', net: 'Pas de connexion Internet', retry: 'Serveur occupé ou connexion faible, nouvel essai automatique...',
       bad: 'Inscription indisponible. Si l’activité vient d’être créée, rouvrez le lien dans une minute ; sinon demandez le lien aux organisateurs.', closed: 'Les inscriptions à cette activité sont fermées.', send: 'S’inscrire',
       male: 'Homme', female: 'Femme', required: 'Champ obligatoire', badEmail: 'E-mail incorrect', yourCode: 'Votre code de présence',
       show: 'Montrez ce code aux organisateurs à la fin de l’activité. S’il ne se scanne pas, donnez-leur le numéro d’inscription.', number: 'Numéro d’inscription',
       confirmed: 'Inscription confirmée ✓', pending: 'Le code est valable. Envoi de l’inscription... (elle se termine seule au retour de la connexion)', again: 'Vous étiez déjà inscrit : voici votre code.',
       saveImg: 'Enregistrer en image', longPress: 'Si l’image ne s’enregistre pas : appuyez longuement dessus, puis « Enregistrer l’image ».', another: 'Inscrire une autre personne depuis ce téléphone',
       already: 'Déjà inscrit à cette activité ? Retrouvez votre code', findT: 'Retrouver le code de présence', findPhone: 'Le téléphone de l’inscription', findFirst: 'Votre prénom',
       find: 'Retrouver', notFound: 'Aucune inscription avec ce téléphone et ce prénom dans cette activité.', busy: 'Trop de demandes, réessayez dans un instant.', back: 'Retour',
       mine: 'Inscriptions depuis ce téléphone :', here: 'Présence confirmée', hereIn: 'Présence confirmée : séance {n} sur {m}', hereThanks: 'Merci de votre présence. Votre attestation vous parviendra par e-mail dès son émission.', hereNext: 'Votre code réapparaît ici à la prochaine séance.', showMine: 'Afficher mon code', nameMissing: 'Écrivez au moins le nom'},
  en: {title: 'Register for the activity', lead: 'Register and keep your attendance code: it is scanned at the end.', loading: 'Loading...', net: 'No Internet connection', retry: 'Server busy or weak connection, trying again...',
       bad: 'Registration is not available. If the activity is new, open the link again in a minute; otherwise ask the organizers for it.', closed: 'Registration for this activity is closed.', send: 'Register',
       male: 'Male', female: 'Female', required: 'Required', badEmail: 'Wrong email', yourCode: 'Your attendance code',
       show: 'Show this code to the organizers at the end of the activity. If it does not scan, give them the registration number.', number: 'Registration number',
       confirmed: 'Registration confirmed ✓', pending: 'The code is valid. Sending the registration... (it completes by itself when the connection is back)', again: 'You were registered already: this is your code.',
       saveImg: 'Save as a picture', longPress: 'If the picture is not saved: press and hold it, then “Save image”.', another: 'Register someone else from this phone',
       already: 'Registered already? Get your code back', findT: 'Get your attendance code back', findPhone: 'The phone you registered with', findFirst: 'Your first name',
       find: 'Find', notFound: 'No registration with this phone and first name in this activity.', busy: 'Too many requests, try again shortly.', back: 'Back',
       mine: 'Registrations from this phone:', here: 'Attendance confirmed', hereIn: 'Attendance confirmed: session {n} of {m}', hereThanks: 'Thank you for attending. Your certificate will reach your email once issued.', hereNext: 'Your code shows here again at the next session.', showMine: 'Show my code', nameMissing: 'Write the name at least'},
};

const EXEC = 'https://script.google.com/macros/s/AKfycbyhQdedASgHUcB7vIZ6mAtgzy1fo6TFTa0bGybYmjnnU5JV79VRCzwudv8wMSJnL71i/exec';
const {el, t} = UI, app = document.getElementById('app');
const [AID, KEYC] = (new URLSearchParams(location.search).get('r') || '').split('-');
const STORE = 'shawahid-reg-' + AID, INFO = 'shawahid-reginfo-' + AID;
const load = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* this phone keeps nothing: the page still works while open */ } };
let regs = load(STORE) || [], info = load(INFO), current = null, view = () => {};

async function call(action, extra) {
  const r = await fetch(EXEC, {method: 'POST', credentials: 'omit', body: JSON.stringify(Object.assign({action, a: AID, k: KEYC}, extra))});
  return r.json();
}
const show = (...kids) => app.replaceChildren(...kids.filter(Boolean));
const card = (...kids) => el('section', {className: 'card pad rise narrow', style: 'margin-top:16px'}, ...kids);
const newUid = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
const nameOf = (d, lang) => (lang === 'ar' ? [[d.first_ar, d.last_ar], [d.first_lat, d.last_lat]] : [[d.first_lat, d.last_lat], [d.first_ar, d.last_ar]])
  .map(p => p.filter(Boolean).join(' ')).find(Boolean) || '';
// made here: valid at once; the name inside (UTF-8, base64url: plain letters any scanner reads) is shown even with no connection
const b64url = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const codeOf = r => 'R' + AID + '.' + r.uid + '.' + b64url(r.name.slice(0, 40));
const numOf = ticket => (ticket || '').replace(/^T/, '');

// the QR library from the CDN, once; the drawn code is kept on the phone, so it shows again with no connection
let qrLib = null;
const lib = () => qrLib = qrLib || new Promise((ok, bad) => document.head.append(el('script', {src: 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', onload: ok, onerror: bad})));
async function qrUrl(r) {
  if (r.qr && r.qrFor === codeOf(r)) return r.qr;
  await lib();
  const q = qrcode(0, 'M');
  q.addData(codeOf(r));
  q.make();
  r.qr = q.createDataURL(8, 2); r.qrFor = codeOf(r);
  save(STORE, regs);
  return r.qr;
}

// ---------- sending: until the server keeps it (a busy moment, a lost connection: tried again by itself) ----------
let sending = false;
async function sendPending() {
  if (sending || !navigator.onLine || !regs.some(x => !x.ok && !x.refused)) return;  // nothing waiting: the page stays as it is
  sending = true;
  let changed = false, soon = false;
  try {
    for (const r of regs.filter(x => !x.ok && !x.refused)) {
      const j = await call('reg', {uid: r.uid, data: r.data, hp: r.hp || ''});
      if (j.status === 'ok') {
        if (j.uid && j.uid !== r.uid) { r.uid = j.uid; r.again = true; }  // registered before: their own code
        Object.assign(r, {ok: true, ticket: j.ticket, name: j.name || r.name});
        delete r.data;
        changed = true;
      } else if (['bad', 'noname', 'email', 'closed', 'missing_answer'].includes(j.status)) {  // 'missing': a new activity not yet online, tried again
        Object.assign(r, {ok: false, refused: j.status});  // kept on the phone: its code still shows
        changed = true;
      } else if (j.status === 'queued') soon = true;  // in line on the server: its number is ready in a few seconds
      save(STORE, regs);
    }
  } catch (e) { /* offline or busy: tried again shortly */ }
  sending = false;
  if (soon) setTimeout(sendPending, 4000 + Math.random() * 3000);
  if (changed && current) showTicket(current);  // redrawn only when its state changed (a redraw every 15 s made the code blink)
}
setInterval(sendPending, 15000);
addEventListener('online', sendPending);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sendPending(); });  // a locked phone stops its timers: sent when it is looked at again

// ---------- the person's code: the QR, their number, a picture to keep ----------
// ---------- scanned by the organizers: the page asks (from the server's cache, never a sheet) every 20 s or so while it shows ----------
// One session: the code gives way to the confirmation for good. Several: confirmed for this session, the code comes back at the next.
const here = r => !!(r.done || (r.seenIn && r.seenIn === r.cur));
let seenBusy = false, seenTimer = null, codeAnyway = null;
async function checkSeen() {
  clearTimeout(seenTimer); seenTimer = null;
  const r = current;
  if (!r || r.done || seenBusy || document.visibilityState !== 'visible') return;  // hidden: asked again when looked at
  seenBusy = true;
  let wait = 18000 + Math.random() * 6000;  // spread out: hundreds of phones while everyone leaves
  try {
    const j = await call('regseen', {t: r.ticket || '', u: r.uid}), was = here(r);
    if (j.status === 'ok') {
      Object.assign(r, {cur: j.session, sessions: j.sessions});
      if (j.seen) Object.assign(r, {seenIn: j.session}, j.session >= j.sessions ? {done: true} : {});
      save(STORE, regs);
      if (here(r) !== was && current === r) { codeAnyway = null; showTicket(r); }
      if (here(r)) wait = 60000;  // confirmed for this session: only the next session changes it
    } else wait = 60000;
  } catch (e) { wait = 60000; }  // busy or offline: later, gently
  seenBusy = false;
  if (current && !current.done) seenTimer = setTimeout(checkSeen, wait);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkSeen(); });
const othersOf = r => regs.length > 1 ? el('div', {}, el('p', {className: 'hint', style: 'margin:0 0 6px', textContent: t('mine')}), el('div', {className: 'others'},
  ...regs.map(x => el('button', {type: 'button', ariaPressed: String(x === r), textContent: x.name, onclick: () => showTicket(x)})))) : null;

function showHere(r) {
  const next = !r.done && r.sessions > 1;
  show(card(othersOf(r), el('div', {className: 'ticket here'},
    el('div', {className: 'tick', ariaHidden: 'true', textContent: '✓'}),
    el('h2', {textContent: r.sessions > 1 ? t('hereIn').replace('{n}', r.seenIn).replace('{m}', r.sessions) : t('here')}),
    el('div', {className: 'name', dir: 'auto', textContent: r.name}),
    info ? el('p', {className: 'act', dir: 'auto', textContent: info.title}) : null, info && intro() ? el('p', {className: 'hint', dir: 'auto', style: 'margin:0', textContent: intro()}) : null,
    r.ticket ? el('div', {style: 'margin-top:10px'}, el('div', {className: 'hint', textContent: t('number')}), el('div', {className: 'num', textContent: numOf(r.ticket)})) : null,
    el('p', {className: 'state ok', textContent: next ? t('hereNext') : t('hereThanks')}),
    next ? el('div', {className: 'btns'}, el('button', {className: 'btn ghost', type: 'button', textContent: t('showMine'), onclick: () => { codeAnyway = r; showTicket(r); }})) : null)));
}

async function showTicket(r) {
  current = r;
  view = () => showTicket(r);
  if (!seenTimer && !seenBusy) seenTimer = setTimeout(checkSeen, 1500);
  if (here(r) && codeAnyway !== r) return showHere(r);
  const drawn = r.qr && r.qrFor === codeOf(r), img = el('img', drawn ? {alt: t('yourCode'), src: r.qr} : {alt: t('yourCode')});  // drawn already: shown at once
  const st = r.ok ? el('p', {className: 'state ok', textContent: r.again ? t('again') : t('confirmed')}) : el('p', {className: 'state wait', textContent: t('pending')});
  const others = othersOf(r);
  const saved = el('div', {className: 'saved'});
  show(card(others, el('div', {className: 'ticket'},
      el('h2', {style: 'margin:0', textContent: t('yourCode')}), el('div', {className: 'name', dir: 'auto', textContent: r.name}),
      el('div', {className: 'qr'}, img),
      r.ticket ? el('div', {}, el('div', {className: 'hint', textContent: t('number')}), el('div', {className: 'num', textContent: numOf(r.ticket)})) : null,
      st, el('p', {className: 'hint', textContent: t('show')}),
      el('div', {className: 'btns'}, el('button', {className: 'btn', type: 'button', textContent: t('saveImg'), onclick: () => picture(r, img, saved)}),
        el('button', {className: 'btn ghost', type: 'button', textContent: t('another'), onclick: () => form()})), saved)));
  if (!drawn) img.src = await qrUrl(r).catch(() => '');
}

function picture(r, img, box) {  // the code, the name, the number and the activity on one picture
  const W = 720, c = el('canvas', {width: W, height: 980}), x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, W, 980);
  x.fillStyle = '#0b3b5c'; x.fillRect(0, 0, W, 120);
  x.textAlign = 'center'; x.direction = 'rtl';
  x.fillStyle = '#ffffff'; x.font = 'bold 30px "IBM Plex Sans Arabic", sans-serif'; x.fillText((info && info.title || '').slice(0, 44), W / 2, 72);
  x.fillStyle = '#111111'; x.font = 'bold 38px "IBM Plex Sans Arabic", sans-serif'; x.fillText(r.name, W / 2, 190);
  x.imageSmoothingEnabled = false; x.drawImage(img, 120, 230, 480, 480);
  if (r.ticket) { x.fillStyle = '#555555'; x.font = '24px "IBM Plex Sans Arabic", sans-serif'; x.fillText(t('number'), W / 2, 770);
    x.fillStyle = '#0b3b5c'; x.font = 'bold 64px monospace'; x.direction = 'ltr'; x.fillText(numOf(r.ticket), W / 2, 850); }
  x.direction = 'rtl'; x.fillStyle = '#555555'; x.font = '22px "IBM Plex Sans Arabic", sans-serif'; x.fillText((info ? intro() : '').slice(0, 60), W / 2, 925);
  x.fillStyle = '#0b3b5c'; x.fillRect(0, 960, W, 20);
  const url = c.toDataURL('image/png');
  box.replaceChildren(el('p', {className: 'hint', textContent: t('longPress')}), el('img', {src: url, alt: t('yourCode')}));
  el('a', {href: url, download: 'code-' + AID + '-' + numOf(r.ticket || r.uid.slice(0, 6)) + '.png'}).click();
}

// the form's description without its last paragraph (the paper card's instructions) and its empty dashes: who, when
const intro = () => (info.desc || '').split(/\n\s*\n/)[0].split('\n').map(x => x.replace(/^\s*—\s*$/, '').replace(/\s*—\s*$/, '').trim()).filter(Boolean).join(' · ');

// ---------- the questions: the activity's form, made from what the platform knows ----------
function form() {
  current = null;
  view = form;
  if (!info) return show(card(el('p', {className: 'muted', textContent: t('net')})));
  if (info.status === 'closed') return show(card(el('p', {textContent: t('closed')})), regs.length ? card(el('button', {className: 'btn', type: 'button', textContent: t('yourCode'), onclick: () => showTicket(regs[0])})) : null);
  const L = info.labels, inputs = {}, err = el('p', {className: 'err', role: 'alert'});
  const fld = (k, props, req) => { const i = el('input', Object.assign({name: k}, props)); inputs[k] = i;
    return el('label', {className: 'fld'}, el('span', {}, L[k], req ? el('span', {className: 'req', textContent: ' *'}) : null), i); };
  const gender = el('div', {className: 'opts'}, ...[['m', info.male], ['f', info.female]].map(([v, x]) => el('label', {}, el('input', {type: 'radio', name: 'gender', value: v}), x)));
  const qs = info.questions.map(q => {
    let box;
    if (['choice', 'checkbox'].includes(q.type)) box = el('div', {className: 'opts'}, ...q.options.map(o => el('label', {}, el('input', {type: q.type === 'choice' ? 'radio' : 'checkbox', name: 'x_' + q.key, value: o}), el('span', {dir: 'auto', textContent: o}))));
    else if (q.type === 'dropdown') box = el('select', {name: 'x_' + q.key}, el('option', {value: '', textContent: '—'}), ...q.options.map(o => el('option', {value: o, textContent: o})));
    else box = el(q.type === 'paragraph' ? 'textarea' : 'input', {name: 'x_' + q.key, type: q.type === 'date' ? 'date' : 'text', rows: 3, dir: 'auto'});
    return el('div', {className: 'fld'}, el('span', {dir: 'auto'}, q.title, q.required ? el('span', {className: 'req', textContent: ' *'}) : null), q.help ? el('small', {dir: 'auto', textContent: q.help}) : null, box);
  });
  const hp = el('input', {name: 'website', tabIndex: -1, autocomplete: 'off', ariaHidden: 'true'});
  const go = el('button', {className: 'btn', type: 'submit', textContent: t('send'), style: 'width:100%'});
  const f = el('form', {noValidate: true}, intro() ? el('p', {className: 'desc', dir: 'auto', textContent: intro()}) : null,
    el('div', {className: 'grid2'}, fld('first_ar', {dir: 'rtl'}, 1), fld('last_ar', {dir: 'rtl'}, 1), fld('first_lat', {dir: 'ltr'}, 1), fld('last_lat', {dir: 'ltr'}, 1)),
    el('div', {className: 'fld'}, el('span', {}, L.gender, el('span', {className: 'req', textContent: ' *'})), gender),
    fld('phone', {type: 'tel', dir: 'ltr', inputMode: 'tel', autocomplete: 'tel'}, 1), fld('email', {type: 'email', dir: 'ltr', autocomplete: 'email'}, 1),
    ...qs, el('div', {className: 'hp', ariaHidden: 'true'}, hp), go, err);
  f.onsubmit = e => {
    e.preventDefault();
    const d = Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value.trim()]));
    d.gender = (f.querySelector('input[name=gender]:checked') || {}).value || '';
    d.x = {};
    for (const q of info.questions) {
      const vals = [...f.querySelectorAll(`[name="x_${q.key}"]`)].filter(i => !['radio', 'checkbox'].includes(i.type) || i.checked).map(i => i.value.trim()).filter(Boolean);
      d.x[q.key] = q.type === 'checkbox' ? vals : vals[0] || '';
      if (q.required && !vals.length) { err.textContent = q.title + ' — ' + t('required'); return; }
    }
    const missing = ['first_ar', 'last_ar', 'first_lat', 'last_lat', 'phone', 'email'].find(k => !d[k]);
    if (missing || !d.gender) { err.textContent = (missing ? L[missing] : L.gender) + ' — ' + t('required'); return (missing ? inputs[missing] : f.querySelector('input[name=gender]')).focus(); }
    if (!/^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/.test(d.email)) { err.textContent = t('badEmail'); return inputs.email.focus(); }
    const r = {uid: newUid(), name: nameOf(d, info.lang), data: d, hp: hp.value, ok: false, at: Date.now()};
    regs.unshift(r);
    save(STORE, regs);
    showTicket(r);  // the code at once; the registration leaves behind it
    sendPending();
  };
  show(card(f), card(el('button', {className: 'btn ghost', type: 'button', style: 'width:100%', textContent: t('already'), onclick: findForm})));
}

function findForm() {  // a new phone, a cleared browser: the code again by phone and first name
  view = findForm;
  const ph = el('input', {type: 'tel', dir: 'ltr', inputMode: 'tel'}), first = el('input', {dir: 'auto'}), say = el('p', {className: 'err', role: 'alert'});
  const go = el('button', {className: 'btn', type: 'submit', textContent: t('find')});
  const f = el('form', {noValidate: true}, el('h2', {style: 'margin-top:0', textContent: t('findT')}),
    el('label', {className: 'fld'}, el('span', {textContent: t('findPhone')}), ph), el('label', {className: 'fld'}, el('span', {textContent: t('findFirst')}), first),
    el('div', {className: 'btns', style: 'justify-content:flex-start'}, go, el('button', {className: 'btn ghost', type: 'button', textContent: t('back'), onclick: form})), say);
  f.onsubmit = async e => {
    e.preventDefault();
    go.disabled = true;
    const j = await call('regfind', {phone: ph.value, first: first.value}).catch(() => ({status: 'net'}));
    go.disabled = false;
    if (j.status !== 'ok') { say.textContent = t({none: 'notFound', busy: 'busy', net: 'net'}[j.status] || 'notFound'); return; }
    let r = regs.find(x => x.uid === j.uid);
    if (!r) { r = {uid: j.uid, name: j.name, ticket: j.ticket, ok: true, again: true}; regs.unshift(r); save(STORE, regs); }
    showTicket(r);
  };
  show(card(f));
}

async function start() {
  if (!/^\d+$/.test(AID || '') || !KEYC) return show(card(el('p', {textContent: t('bad')})));
  document.getElementById('actTitle').textContent = info ? info.title : t('title');
  if (regs.length) showTicket(regs[0]); else if (info) form(); else show(card(el('p', {className: 'muted', textContent: t('loading')})));  // kept questions: at once
  const had = info;
  try {  // the activity's questions, kept on the phone for the next visit
    const j = await call('reginfo');
    if (j.status === 'missing') { info = null; save(INFO, null); return regs.length ? null : show(card(el('p', {textContent: t('bad')}))); }
    info = j; save(INFO, j);
    document.getElementById('actTitle').textContent = j.title;
    if (!had && UI.lang !== j.lang && !UI.store.get('lang')) UI.setLang(j.lang);  // the activity's language, unless chosen
  } catch (e) {  // no connection, or hundreds opening at once (the server turns some away): tried again by itself
    if (!info && !regs.length) { show(card(el('p', {className: 'muted', textContent: t('retry')}))); return setTimeout(start, 3000 + Math.random() * 4000); }
  }
  if (regs.length) sendPending();
  else if (!had || JSON.stringify(had) !== JSON.stringify(info)) form();  // drawn again only when the questions changed
}

UI.init({page: 'reg', name: 'title', T, onLang: () => view()});
start();
</script>
