<style>
  /* the platform's look (app.css, the same file as on the computer), plus what the public pages' ui.css gave this page */
  :root { --surface: var(--card); --surface-2: var(--soft); --brand: var(--pri); --brand-2: var(--pri); --on-brand: var(--on-pri);
          --hero: var(--side); --radius: var(--r); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .hint { font-size: 13px; color: var(--muted); margin: 0; background: none; border: 0; padding: 0; border-radius: 0; }  /* a quiet line, not the app's banner */
  .say { font-size: 14px; margin: 0; min-height: 1.4em; color: var(--err); }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--pri); text-decoration: underline; cursor: pointer; }
  .serial { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--gold-soft); border-radius: 8px; padding: 2px 8px; }
  .btn.block { width: 100%; }
  .skeleton { padding: 22px; display: grid; gap: 12px; }
  .skeleton i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--line), var(--soft), var(--line));
                background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .toast { position: fixed; z-index: 60; bottom: calc(20px + env(safe-area-inset-bottom)); inset-inline: 0; margin: auto; width: max-content; max-width: 90vw;
           background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow); animation: rise .2s ease-out; }
  .rise { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .langs { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button { background: none; border: 0; color: var(--ink); min-width: 36px; min-height: 30px; padding: 0 9px; border-radius: 999px; font-size: 13px; }
  .langs button[aria-pressed="true"] { background: var(--pri); color: var(--on-pri); }
  .iconbtn svg { width: 19px; height: 19px; }
  .appbar h1 { font-size: 18px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .appbar .back svg { transform: scaleX(-1); } [dir="ltr"] .appbar .back svg { transform: none; }
  .side nav a { cursor: pointer; }
  .side nav a.locked { opacity: .5; cursor: not-allowed; }
  .side nav a.locked:hover { background: none; }
  .side nav a .lockb { margin-inline-start: auto; font-size: 10.5px; font-weight: 600; border: 1px solid rgba(255, 255, 255, .3); border-radius: 20px; padding: 0 7px; }
  .side .who { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: #fff; }
  .side .who span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .who button { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: #fff; }
  .pclock { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); border: 1px dashed var(--field);
            border-radius: 20px; padding: 1px 8px; white-space: nowrap; }
  .pclist { display: grid; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
  .pclist li { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
  .pclist .ic { color: var(--muted); width: 15px; height: 15px; }

  /* sign-in: the platform's colours on one side, the form on the other (stacked on phones) */
  .signin { min-height: 100vh; display: grid; place-items: center; padding: 20px 16px; position: relative; }
  .signin .tools { position: absolute; top: 14px; inset-inline-end: 16px; display: flex; gap: 8px; }
  .si-card { width: min(940px, 100%); display: grid; grid-template-columns: 1.05fr 1fr; background: var(--card); border: 1px solid var(--line);
             border-radius: 22px; overflow: hidden; box-shadow: 0 2px 4px rgba(16, 32, 48, .05), 0 24px 60px rgba(16, 32, 48, .14); }
  .si-brand { position: relative; padding: 38px 36px; color: #fff; background: var(--side); overflow: hidden; display: flex; flex-direction: column; gap: 18px; }
  .si-brand::before { content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%; inset-inline-end: -120px; bottom: -150px;
                      background: radial-gradient(circle, rgba(226, 182, 90, .35), transparent 65%); }
  .si-brand::after { content: ""; position: absolute; inset: 0; opacity: .07;
                     background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 18px 18px; }
  .si-brand > * { position: relative; z-index: 1; }
  .si-brand .seal { width: 58px; height: 58px; border-radius: 16px; }
  .si-brand .seal .ic { width: 30px; height: 30px; }
  .si-brand h1 { font-size: 28px; margin: 0; }
  .si-brand .sub { margin: -10px 0 0; opacity: .8; font-size: 15px; }
  .si-brand ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
  .si-brand li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.55; }
  .si-brand li .ic { flex: none; width: 22px; height: 22px; padding: 3px; border-radius: 50%; background: rgba(226, 182, 90, .22); color: #f2c14e; }
  .si-form { padding: 38px 36px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .si-form h2 { font-size: 22px; margin: 0; }
  .si-form .hint { margin: 4px 0 10px; }
  .si-form .field { position: relative; }
  .si-form .field > .ic { position: absolute; inset-inline-start: 12px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
  .si-form .field input { height: 46px; padding-inline-start: 40px; border-radius: 11px; font-size: 15.5px; }
  .si-form .eye { position: absolute; inset-inline-end: 6px; top: 50%; translate: 0 -50%; background: none; border: 0; color: var(--pri); font-size: 13px; padding: 6px 8px; }
  .si-form button.go { height: 48px; margin-top: 16px; font-size: 16px; border-radius: 11px; }
  .si-form .links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
  @media (max-width: 760px) {
    .si-card { grid-template-columns: 1fr; }
    .si-brand { padding: 26px 22px; gap: 12px; }
    .si-brand ul { display: none; }
    .si-form { padding: 26px 22px; }
  }

  /* building blocks */
  .app .card { padding: 16px 18px; }
  .app h2 { font-size: 17px; margin: 0 0 8px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); align-items: start; }
  .section { margin-top: 22px; }
  .section > h2 { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.end { justify-content: flex-end; }
  .grow { flex: 1; min-width: 0; }
  .stats { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); }
  .stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 4px; text-align: center; font-size: 12px; color: var(--muted); }
  .stat b { display: block; font-size: 22px; line-height: 1.2; color: var(--ink); }
  a.act-card { display: block; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
  a.act-card:hover { border-color: var(--brand-2); transform: translateY(-1px); }
  .act-card h3 { margin: 6px 0 2px; font-size: 16.5px; line-height: 1.45; }
  .act-card .stats { margin-top: 12px; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .app main select, .app main input:not([type="checkbox"]):not([type="radio"]) { height: 42px; font-size: 15px; font-weight: 400; letter-spacing: 0; }
  select { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--ink); font: inherit; padding: 0 12px; }
  select:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-2) 18%, transparent); }
  .fld { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }
  .fld .star { color: var(--err); }
  .grid2 { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  .form { display: grid; gap: 14px; }
  .form .hint { font-weight: 400; }
  .err { color: var(--err); font-size: 14px; margin: 0; min-height: 1.2em; }
  .linkbox { display: flex; gap: 6px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; }
  [dir="rtl"] .linkbox { padding: 6px 12px 6px 6px; }
  .linkbox span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .pc { margin: 0 0 12px; }
  .pc .badge { white-space: normal; line-height: 1.5; padding-block: 4px; }
  .job { display: grid; gap: 4px; border-top: 1px solid var(--line); padding: 10px 0 2px; font-size: 14px; }
  .job:first-child { border-top: 0; }
  .note { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin: 0 0 14px; }
  ul.plain { margin: 4px 0 0; padding-inline-start: 18px; color: var(--muted); font-size: 14px; }
  .seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; font-size: 14px; padding: 9px 12px; border-radius: 10px;
                cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
  .tabs-sticky { position: sticky; top: 64px; z-index: 4; margin: 14px 0; }
  @media (min-width: 900px) { .tabs-sticky { top: 72px; max-width: 520px; } }
  .person { display: grid; gap: 8px; }
  .person .name { font-weight: 700; font-size: 15.5px; }
  .person .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .person .actions:empty { display: none; }
  .contact { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
  .codev { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 2px; font-weight: 700; }
  .btn.danger { color: var(--err); }
  .pick { display: flex; gap: 10px; align-items: flex-start; color: var(--ink); font-size: 14px; font-weight: 400; border-top: 1px solid var(--line); padding: 9px 0; margin: 0; }
  .pick input { width: 18px; height: 18px; margin-top: 3px; flex: none; }
  .tools-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tools-bar .q { flex: 2 1 220px; } .tools-bar .f { flex: 1 1 150px; }
  .count { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 16px; }
  .login { max-width: 420px; margin: 8vh auto 0; }
  .login h2 { font-size: 22px; }
  .rowline { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
  .rowline:first-of-type { border-top: 0; }
  dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: 18px; width: min(680px, calc(100vw - 20px));
                 max-height: calc(100vh - 40px); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); animation: rise .2s ease-out; }
  dialog.sheet::backdrop { background: rgba(8, 18, 28, .55); }
  dialog.sheet > * { padding: 20px; }
  @media (max-width: 600px) {
    dialog.sheet { width: 100vw; max-width: 100vw; max-height: 92vh; margin: auto 0 0; border-radius: 18px 18px 0 0; }
    dialog.sheet > * { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  }
  .scancode { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding: 12px 14px; border-radius: 12px;
              background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); }
  .scancode > div { flex: 1 1 220px; }
  .scancode .code { font: 700 22px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 3px; color: var(--ink); }
</style>

// one person (an organizer, a speaker...) given certificates in several past activities at once, then one message
function bundleForm(ch, acts, done, close) {
  if (!ch) return activityForm(ch, null, done, close);
  const inputs = {}, picked = new Set(), answers = {};
  const fld = (k, label, props) => { const [l, i] = field(label, props); inputs[k] = i; return l; };
  inputs.gender = select([['m', t('male')], ['f', t('female')], ['', '—']], 'm');
  inputs.type = select(ch.types.map(x => [x, x]), ch.types[0]);
  // what each activity's design prints for a type (published by the app); an app of 1.8.0 only names the types
  const needs = (id, x) => ch.needs ? (ch.needs[id] || {})[x]
    : !ch.designs || (ch.designs[id] || []).includes(x) ? {names: [], mention: false, qs: []} : null;
  const list = el('div'), asked = el('div', {className: 'grid2'}), note = el('p', {className: 'hint'});
  const labels = {};
  let want = new Set(), qs = new Map();  // what the ticked designs print
  const draw = () => {
    want = new Set(); qs = new Map();
    list.replaceChildren(...acts.map(a => {
      const n = needs(a.id, inputs.type.value);
      if (!n) picked.delete(a.id);
      if (n && picked.has(a.id)) { n.names.forEach(x => want.add(x)); if (n.mention) want.add('mention'); n.qs.forEach(q => qs.has(q.title) || qs.set(q.title, q)); }
      const box = el('input', {type: 'checkbox', checked: picked.has(a.id), disabled: !n,
        onchange: () => { box.checked ? picked.add(a.id) : picked.delete(a.id); draw(); }});
      return el('label', {className: 'pick', style: n ? '' : 'opacity:.5'}, box,
        el('span', {}, el('b', {dir: 'auto', textContent: a.title}), ' ', el('span', {className: 'hint', textContent: [a.dates, n ? '' : t('noDesign')].filter(Boolean).join(' — ')})));
    }));
    // every detail the ticked designs print is asked for, so no copy comes out with a blank
    Object.entries({ar: 'first_ar', lat: 'first_lat', mention: 'mention'}).forEach(([k, f]) => { labels[f].textContent = want.has(k) ? ' *' : ''; });
    asked.replaceChildren(...[...qs.values()].map(q => {
      const i = (q.options || []).length && q.type !== 'checkbox' ? select([['', '—'], ...q.options.map(o => [o, o])], answers[q.title] || '')
        : el('input', {value: answers[q.title] || ''});
      i.oninput = i.onchange = () => { answers[q.title] = i.value; };
      i.dataset.q = q.title;
      return el('label', {className: 'fld'}, el('span', {dir: 'auto', textContent: q.title}, el('span', {className: 'star', textContent: ' *'})), i);
    }));
    note.textContent = want.size || qs.size ? t('starNote') : '';
  };
  const star = (f, l) => { labels[f] = el('span', {className: 'star'}); l.firstChild.append(labels[f]); return l; };
  const err = el('p', {className: 'err', role: 'alert'});
  const save = el('button', {className: 'btn', type: 'submit', textContent: t('bSave')});
  const form = el('form', {className: 'form', noValidate: true}, el('div', {}, el('h2', {textContent: t('bT')}), el('p', {className: 'hint', textContent: t('bD')})),
    el('div', {className: 'grid2'}, star('first_ar', fld('first_ar', t('firstAr'))), fld('last_ar', t('lastAr')),
      star('first_lat', fld('first_lat', t('firstLat'), {dir: 'ltr'})), fld('last_lat', t('lastLat'), {dir: 'ltr'})),
    el('div', {className: 'grid2'}, labelled(t('gender'), inputs.gender), labelled(t('certType'), inputs.type)),
    el('div', {className: 'grid2'}, fld('email', t('bEmail'), {type: 'email', dir: 'ltr'}), fld('phone', t('phone'), {type: 'tel', dir: 'ltr'})),
    star('mention', fld('mention', t('mention'))), asked, note,
    el('div', {}, el('h2', {style: 'margin:4px 0 0', textContent: t('bActs')}), list),
    el('div', {className: 'row'}, save, btn(t('cancel'), close, 'ghost')), err);
  inputs.type.onchange = draw; draw();
  form.onsubmit = async e => {
    e.preventDefault();
    const data = {acts: [...picked], answers: {}};
    Object.entries(inputs).forEach(([k, x]) => { const val = x.value.trim(); if (val !== '') data[k] = val; });
    asked.querySelectorAll('[data-q]').forEach(i => { if (i.value.trim()) data.answers[i.dataset.q] = i.value.trim(); });
    if (!data.acts.length) { err.textContent = t('pickOne'); return; }
    const has = (...ks) => ks.some(k => data[k]);
    const lack = [want.has('ar') && !has('first_ar', 'last_ar') && t('nameAr'), want.has('lat') && !has('first_lat', 'last_lat') && t('nameLat'),
      want.has('mention') && !has('mention') && t('mention'), ...[...qs.keys()].filter(x => !data.answers[x])].filter(Boolean);
    if (lack.length) { err.textContent = t('lack') + lack.join('، '); return; }
    save.disabled = true;
    try {
      const r = await call('request', {kind: 'bundle', data});
      if (r.status === 'ok') { toast(t('sent')); return done(); }
      err.textContent = t({noname: 'noname', email: 'badEmail', exists: 'sameWaiting'}[r.status] || 'reqFail');
    } catch (x) { /* toast shown */ }
    save.disabled = false;
  };
  return form;
}

// ---------- one activity: overview, participants, requests ----------

const sessionsOf = p => [...new Set(String(p.attended || '').split(',').filter(Boolean).map(Number).concat(p.phone_scans))].sort();

async function showActivity(id, tab) {

  const tabs = [['overview', 'tOverview'], ['people', 'tPeople'], ...(can('organizer') ? [['requests', 'tRequests']] : [])];

    ariaPressed: String(k === tab), onclick: () => open(k)})));
  const reload = () => showActivity(a.id, tab);
  function open(k) {
    tab = k;
    history.replaceState(null, '', '#a' + a.id + (k === 'overview' ? '' : '/' + k));
    seg.querySelectorAll('button').forEach((b, i) => b.setAttribute('aria-pressed', String(tabs[i][0] === k)));

  }
  function overview() {
    const head = el('section', {className: 'card rise'},

      stats([[t('sReg'), people.length], [t('hereNow'), people.filter(here).length], [t('sCert'), people.filter(p => p.serial).length],
             [t('sMail'), people.filter(p => Number(p.emailed) === 1).length]]));
    if (a.sessions > 1 && !can('organizer')) head.append(el('p', {className: 'hint', style: 'margin-top:10px', textContent: t('scanNow')(a.session)}));
    if (a.sessions > 1 && can('organizer')) {
      const s = select(Array.from({length: a.sessions}, (_, i) => [i + 1, t('sessionN')(i + 1)]), a.session);
      s.onchange = async () => { const r = await call('setsession', {id: a.id, s: Number(s.value)}); if (r.status === 'ok') { toast(t('sessionSet')(r.session)); reload(); } };
      head.append(el('div', {style: 'margin-top:12px;max-width:320px'}, labelled(t('curSession'), s)));
    }

      if (/^https:\/\//.test(a.form)) out.push(el('section', {className: 'card section'}, el('h2', {textContent: t('formLink')}), linkBox(a.form, a.title)));

  function list() {
    const q = el('input', {type: 'search', placeholder: t('search')});

      ...(can('organizer') ? [['mail', t('fMail')]] : [])], 'all');
    f.setAttribute('aria-label', t('tPeople'));
    q.setAttribute('aria-label', t('search'));
    const box = el('div');
    const draw = () => {
      const s = q.value.trim().toLowerCase();
      const keep = {all: () => true, here, away: p => !here(p), issued: p => p.serial, mail: p => p.mail && p.mail.status === 'error'}[f.value];
      const shown = people.filter(p => keep(p) && (!s || [p.name, p.name_ar, p.name_lat, p.ticket, p.serial, p.email, p.phone].join(' ').toLowerCase().includes(s)));
      box.replaceChildren(el('p', {className: 'count', textContent: t('countOf')(shown.length, people.length)}),
        el('div', {className: 'grid'}, ...shown.map(p => personCard(a, p, here, reload))));
    };
    q.oninput = draw; f.onchange = draw;
    const tools = el('div', {className: 'tools-bar'}, el('div', {className: 'q'}, q), el('div', {className: 'f'}, f),
      can('organizer') ? el('button', {className: 'btn', type: 'button', onclick: () => { const close = sheet(personForm(a, null, () => { close(); reload(); }, () => close())); }},
        svg(ICON.plus), t('addPerson')) : null);

  }
  function requests() {
    const ask = (kind, key, sure, ghost) => btn(t(key), async e => {

      el('div', {style: 'margin-top:12px'}, jobList(j.jobs)))];

function personCard(a, p, here, reload) {
  const card = el('article', {className: 'card person'});
  const att = sessionsOf(p);
  const draw = () => {
    const tags = el('div', {className: 'row'});
    if (p.pending) tags.append(el('span', {className: 'badge warn', textContent: t('pending')}));
    tags.append(here(p) ? el('span', {className: 'badge ok', textContent: a.sessions > 1 ? t('hereIn')(a.session) : t('here')})
                        : el('span', {className: 'badge', textContent: t('away')}));
    if (a.sessions > 1 && att.length) tags.append(el('span', {className: 'hint', textContent: t('sessions') + att.join('، ')}));
    if (p.type) tags.append(el('span', {className: 'badge', dir: 'auto', textContent: t('certOf')(p.type)}));
    const parts = [el('div', {className: 'row'}, el('span', {className: 'name grow', dir: 'auto', textContent: p.name || p.name_ar || p.name_lat}),
      p.ticket ? el('span', {className: 'hint ltr', textContent: p.ticket}) : el('span', {className: 'badge', textContent: t('noTicket')})), tags];
    if (p.serial) parts.push(el('div', {className: 'row'}, el('span', {className: 'serial ltr', textContent: p.serial}),
      p.revoked ? el('span', {className: 'badge err', textContent: t('revoked')}) : [
        p.code ? el('span', {className: 'hint'}, t('code') + ': ', el('span', {className: 'codev ltr', textContent: p.code})) : null,
        /^https:\/\//.test(p.link) ? el('a', {href: p.link, target: '_blank', rel: 'noopener', textContent: t('download')}) : null]));
    const contact = [p.email, p.phone].filter(Boolean).join(' · ');
    if (contact) parts.push(el('div', {className: 'contact ltr', textContent: contact}));
    if (p.mail) parts.push(el('div', {}, el('span', {className: 'badge ' + ({sent: 'ok', error: 'err', pending: 'warn'}[p.mail.status] || ''),
      textContent: '✉ ' + (t({sent: 'mSent', error: 'mErr', pending: 'mPending', cancelled: 'mStopped'}[p.mail.status] || '') || p.mail.status)}),
      p.mail.error ? el('span', {className: 'hint', textContent: ' ' + p.mail.error}) : null));
    const acts = el('div', {className: 'actions'});
    if (!here(p) && (p.ticket || p.uid)) {
      const b = btn('✓ ' + (a.sessions > 1 ? t('markIn')(a.session) : t('mark')), async () => {
        b.disabled = true;
        const r = await call('mark', p.ticket ? {id: a.id, ticket: p.ticket} : {id: a.id, uid: p.uid}).catch(() => ({}));
        if (r.status === 'ok') { p.phone_scans.push(r.session); att.push(r.session); toast(t('marked')); draw(); } else b.disabled = false;
      });
      acts.append(b);
    }
    if (can('organizer')) {
      if (p.serial && !p.revoked && p.mail && p.mail.resendable) {
        const b = btn(t('resend'), async () => {
          if (!confirm(t('resendSure')(p.email))) return;
          b.disabled = true;
          const r = await call('resend', {id: a.id, pid: p.pid}).catch(() => ({}));
          toast(t(r.status === 'ok' ? 'resent' : 'resendOld'));
        }, 'ghost');
        acts.append(b);
      }
      if (p.uid) acts.append(btn(t('edit'), () => { const close = sheet(personForm(a, p, () => { close(); reload(); }, () => close())); }, 'ghost'));
      if (p.uid && !p.serial) {  // a certificate's holder stays: its number is public
        const del = btn(t('del'), async () => {
          if (!confirm(t('delSure')(p.name || p.name_ar || p.name_lat))) return;
          del.disabled = true;
          const r = await call('edit', {id: a.id, op: 'delete', uid: p.uid}).catch(() => ({}));
          if (r.status === 'ok') { toast(t('deleted')); reload(); } else del.disabled = false;
        }, 'ghost danger');
        acts.append(del);
      }
    }
    card.replaceChildren(...parts, acts);
  };
  draw();
  return card;
}

// add (p null) or correct a person; the app applies it at its next sync, like the same action on the computer

      el('div', {className: 'hint'}, [t('accSince') + ' ' + when(a.created), a.seen ? t('accSeen') + ' ' + when(a.seen) : '',
        a.claims.length ? t('accAdded')(a.claims.length) : ''].filter(Boolean).join(' · ')),
      el('div', {className: 'actions'}, btn(t('accClose'), async () => {
        if (!confirm(t('accCloseAsk')(a.name))) return;
        const r = await call('account', {op: 'close', id: a.id}).catch(() => ({}));
        toast(r.status === 'ok' ? t('accClosed') : t('saveFail'));
        if (r.status === 'ok') showParticipants();
      }, 'ghost'))))) : el('p', {className: 'hint', textContent: t('accNone')}));
  };
  q.oninput = draw;
  draw();
  return el('section', {className: 'card rise section'}, el('h2', {textContent: t('accT')(j.accounts.length)}),
    el('p', {className: 'hint', style: 'margin:0 0 10px', textContent: t('accD')}),
    j.accounts.length > 6 ? el('div', {className: 'q', style: 'margin-bottom:10px'}, q) : null, box);
}

async function recoveriesBox() {  // «شواهدي» holders who lost email and password: the administrator checks, then approves
  const j = await call('recoveries').catch(() => ({}));
  if (j.status !== 'ok' || !j.requests.length) return null;
  const act = (r, op) => async () => {
    if (op === 'apply' && !confirm(t('recApplyAsk')(r.name, r.email))) return;
    const a = await call('recovery', {op, id: r.id}).catch(() => ({}));
    toast(a.status === 'ok' ? t('recDone') : t('saveFail'));
    if (a.status === 'ok') showParticipants();
  };
  return el('section', {className: 'card rise section'}, el('h2', {textContent: t('recT')(j.requests.length)}),
    el('p', {className: 'hint', style: 'margin:0 0 10px', textContent: t('recD')}),
    el('div', {className: 'grid'}, ...j.requests.map(r => el('article', {className: 'card person'},
      el('div', {className: 'row'}, el('span', {className: 'name grow', dir: 'auto', textContent: r.name}), el('span', {className: 'badge ltr', textContent: '0' + r.phone})),
      el('div', {className: 'contact'}, t('recNewEmail') + ': ', el('span', {className: 'ltr', textContent: r.email})),
      el('div', {className: 'hint'}, r.account ? [t('recAcc') + ':', r.account.name, r.account.email].join(' ') : t('recNoAcc')),
      el('div', {className: 'hint', dir: 'auto'}, [when(r.at), r.serial, r.note].filter(Boolean).join(' · ')),
      el('div', {className: 'actions'}, r.account ? btn(t('recApply'), act(r, 'apply')) : null, btn(t('recDismiss'), act(r, 'dismiss'), 'ghost'))))));
}

// ---------- accounts (admin) ----------

async function showUsers() {
  mark('users'); bar(t('nUsers')); loading();
  const j = await call('users');
  if (j.status !== 'ok') return showList();
  const rows = j.users.map(u => el('tr', {style: u.active ? '' : 'opacity:.6'},
    el('td', {dir: 'auto'}, el('b', {style: 'font-weight:600', textContent: u.name})), el('td', {className: 'ltr', textContent: u.login}),
    el('td', {textContent: roleName(u.role)}), el('td', {dir: 'auto', textContent: u.orgName || (u.role === 'super' ? t('allOrgs') : '—')}),
    el('td', {}, el('span', {className: 'badge ' + (u.active ? 'ok' : ''), textContent: t(u.active ? 'accOpen' : 'accClosedB')}))));
  app.replaceChildren(el('section', {className: 'card rise'},
    el('div', {className: 'bar', style: 'margin-bottom:10px'}, el('h2', {style: 'margin:0', textContent: t('nUsers') + ' (' + j.users.length + ')'}),
      el('span', {className: 'sp'}), el('span', {className: 'pclock', title: t('onPcT')}, ic('lock'), t('onPc'))),
    el('p', {className: 'hint', style: 'margin-bottom:12px', textContent: t('usersRO')}),
    el('div', {className: 'tablewrap'}, el('table', {}, el('thead', {}, el('tr', {}, ...['uName', 'login', 'uRole', 'nOrg', ''].map(k =>
      el('th', {textContent: k ? t(k) : ''})))), el('tbody', {}, ...rows)))));
}

// ---------- my account: language, theme, password, sign out ----------

async function showMe() {
  mark('me'); bar(t('nMe'));
  if (!me) { loading(); await call('activities'); }  // opened directly: the answer names the account
  const choice = (opts, value, pick) => el('div', {className: 'seg'}, ...opts.map(([v, key]) => el('button', {type: 'button', textContent: t(key),
    ariaPressed: String(v === value), onclick: e => { pick(v); e.target.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === e.target))); }})));
  const blocks = [el('section', {className: 'card rise'}, el('p', {className: 'hint', style: 'margin:0', textContent: t('signedAs')}),
    el('div', {className: 'row'}, el('span', {className: 'name grow', dir: 'auto', style: 'font-size:18px;font-weight:700', textContent: me.name}),
      el('span', {className: 'badge', textContent: roleName(me.role)}), el('span', {className: 'hint ltr', textContent: me.login})),
    el('div', {className: 'grid2', style: 'margin-top:16px'},
      labelled(t('language'), choice([['ar', 'langAr'], ['fr', 'langFr'], ['en', 'langEn']], UI.lang, l => UI.setLang(l))),
      labelled(t('theme'), choice([['auto', 'thAuto'], ['light', 'thLight'], ['dark', 'thDark']], UI.theme, v => UI.setTheme(v)))))];
  blocks.push(el('section', {className: 'card section'}, el('div', {className: 'bar'}, el('h2', {style: 'margin:0', textContent: t('pwT')}),
    el('span', {className: 'sp'}), el('span', {className: 'pclock', title: t('onPcT')}, ic('lock'), t('onPc'))),
    el('p', {className: 'hint', style: 'margin-top:8px', textContent: t('pwPc')})));
  blocks.push(el('div', {className: 'section'}, el('button', {className: 'btn danger', type: 'button', textContent: t('logout'), onclick: signOut})));
  app.replaceChildren(...blocks);
}

function route() {
  if (!session) return showLogin();
  const h = location.hash, m = h.match(/^#a(\d+)(?:\/(\w+))?$/);
  if (h === '#pw') { location.hash = '#me'; return; }  // the old address of the password page
  const go = m ? () => showActivity(m[1], m[2])
    : {'#users': showUsers, '#parts': showParticipants, '#me': showMe, '#bundle': () => showList(newBundle)}[h] || (() => showList());
  scrollTo(0, 0);
  go().catch(() => {});
}
UI.init({page: 'dashboard', name: 'dash', shell: false, T, onLang: () => { if (me) { frame(); route(); } else if (!session) showLogin(); }});
addEventListener('hashchange', route);
route();
</script>
</body>
