<style>
  /* the platform's look (app.css, the same file as on the computer), plus what the public pages' ui.css gave this page */
  :root { --surface: var(--card); --surface-2: var(--soft); --brand: var(--pri); --brand-2: var(--pri); --on-brand: var(--on-pri);
          --hero: var(--side); --radius: var(--r); }
  .ltr { direction: ltr; unicode-bidi: isolate; }
  .hint { font-size: 13px; color: var(--muted); margin: 0; background: none; border: 0; padding: 0; border-radius: 0; }  /* a quiet line, not the app's banner */
  .say { font-size: 14px; margin: 0; min-height: 1.4em; color: var(--err); }
  .linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--pri); text-decoration: underline; cursor: pointer; }
  .serial { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--gold-soft); border-radius: 8px; padding: 2px 8px; }
  .btn.block { width: 100%; }
  .skeleton { padding: 22px; display: grid; gap: 12px; }
  .skeleton i { display: block; height: 14px; border-radius: 7px; background: linear-gradient(90deg, var(--line), var(--soft), var(--line));
                background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .toast { position: fixed; z-index: 60; bottom: calc(20px + env(safe-area-inset-bottom)); inset-inline: 0; margin: auto; width: max-content; max-width: 90vw;
           background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: 14px; box-shadow: var(--shadow); animation: rise .2s ease-out; }
  .rise { animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .langs { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .langs button { background: none; border: 0; color: var(--ink); min-width: 40px; min-height: 38px; padding: 0 10px; border-radius: 999px; font-size: 13px; }  /* a finger, not a cursor */
  .langs button[aria-pressed="true"] { background: var(--pri); color: var(--on-pri); }
  .iconbtn svg { width: 19px; height: 19px; }
  .appbar h1 { font-size: 18px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .appbar .back svg { transform: scaleX(-1); } [dir="ltr"] .appbar .back svg { transform: none; }
  .side nav a { cursor: pointer; }
  .side nav a.locked { opacity: .5; cursor: not-allowed; }
  .side nav a.locked:hover { background: none; }
  .side nav a .lockb { margin-inline-start: auto; font-size: 10.5px; font-weight: 600; border: 1px solid rgba(255, 255, 255, .3); border-radius: 20px; padding: 0 7px; }
  .side .who { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: #fff; }
  .side .who span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side .who button { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: #fff; }
  .pclock { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); border: 1px dashed var(--field);
            border-radius: 20px; padding: 1px 8px; white-space: nowrap; }
  .pcbtn { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 7px; padding: 8px 14px; border: 1px dashed var(--field); border-radius: 9px;
           color: var(--muted); font-weight: 600; font-size: 14px; cursor: not-allowed; background: var(--soft); }
  .pclink { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--muted); cursor: not-allowed; }
  .links { display: flex; flex-wrap: wrap; gap: 8px 16px; }  /* on a phone the links go under each other */
  .method.locked { opacity: .62; cursor: not-allowed; }
  .method.locked:hover { background: var(--soft); border-color: var(--line); }
  .doclink.locked { cursor: not-allowed; opacity: .7; }
  .doclink.locked:hover { background: var(--soft); border-color: var(--line); }
  .doclink.locked b { display: flex; align-items: center; gap: 6px; justify-content: space-between; }
  .menu .items .lockrow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; color: var(--muted); font-size: 14px; cursor: not-allowed; flex-wrap: wrap; }  /* long French labels wrap on a phone */
  @media (max-width: 560px) { .kpis { grid-template-columns: 1fr 1fr; } .kpi { padding: 10px 12px; gap: 10px; } .kpi .ico { width: 36px; height: 36px; } }
  .pclist { display: grid; gap: 6px; margin: 4px 0 0; padding: 0; list-style: none; }
  .pclist li { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
  .pclist .ic { color: var(--muted); width: 15px; height: 15px; }

  /* sign-in: the platform's colours on one side, the form on the other (stacked on phones) */
  .signin { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; justify-items: center; align-items: center; padding: 14px 16px 20px; }
  .signin .tools { justify-self: end; display: flex; gap: 8px; margin-bottom: 12px; }  /* in the flow: a short window never puts the card over it */
  .si-card { width: min(940px, 100%); display: grid; grid-template-columns: 1.05fr 1fr; background: var(--card); border: 1px solid var(--line);
             border-radius: 22px; overflow: hidden; box-shadow: 0 2px 4px rgba(16, 32, 48, .05), 0 24px 60px rgba(16, 32, 48, .14); }
  .si-brand { position: relative; padding: 38px 36px; color: #fff; background: var(--side); overflow: hidden; display: flex; flex-direction: column; gap: 18px; }
  .si-brand::before { content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%; inset-inline-end: -120px; bottom: -150px;
                      background: radial-gradient(circle, rgba(226, 182, 90, .35), transparent 65%); }
  .si-brand::after { content: ""; position: absolute; inset: 0; opacity: .07;
                     background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 18px 18px; }
  .si-brand > * { position: relative; z-index: 1; }
  .si-brand .seal { width: 58px; height: 58px; border-radius: 16px; }
  .si-brand .seal .ic { width: 30px; height: 30px; }
  .si-brand h1 { font-size: 28px; margin: 0; }
  .si-brand .sub { margin: -10px 0 0; opacity: .8; font-size: 15px; }
  .si-brand ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
  .si-brand li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.55; }
  .si-brand li .ic { flex: none; width: 22px; height: 22px; padding: 3px; border-radius: 50%; background: rgba(226, 182, 90, .22); color: #f2c14e; }
  .si-form { padding: 38px 36px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
  .si-form h2 { font-size: 22px; margin: 0; }
  .si-form .hint { margin: 4px 0 10px; }
  .si-form .field { position: relative; }
  .si-form .field > .ic { position: absolute; inset-inline-start: 12px; top: 50%; translate: 0 -50%; color: var(--muted); pointer-events: none; }
  .si-form .field input { height: 46px; padding-inline-start: 40px; border-radius: 11px; font-size: 15.5px; }
  .si-form .eye { min-height: 36px; position: absolute; inset-inline-end: 6px; top: 50%; translate: 0 -50%; background: none; border: 0; color: var(--pri); font-size: 13px; padding: 6px 8px; }
  .si-form button.go { height: 48px; margin-top: 16px; font-size: 16px; border-radius: 11px; }
  .si-form .links { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13.5px; }
  @media (max-width: 760px) {
    .si-card { grid-template-columns: 1fr; }
    .si-brand { padding: 26px 22px; gap: 12px; }
    .si-brand ul { display: none; }
    .si-form { padding: 26px 22px; }
  }

  .app button, .app .btn { max-width: 100%; white-space: normal; text-align: center; }  /* a long label wraps, never past the screen */
  /* building blocks */
  .app .card { padding: 16px 18px; }
  .app h2 { font-size: 17px; margin: 0 0 8px; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); align-items: start; }
  .section { margin-top: 22px; }
  .section > h2 { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.end { justify-content: flex-end; }
  .grow { flex: 1; min-width: 0; }
  .stats { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); }
  .stat { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 9px 4px; text-align: center; font-size: 12px; color: var(--muted); }
  .stat b { display: block; font-size: 22px; line-height: 1.2; color: var(--ink); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .app main select, .app main input:not([type="checkbox"]):not([type="radio"]) { height: 42px; font-size: 15px; font-weight: 400; letter-spacing: 0; }
  select { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface-2); color: var(--ink); font: inherit; padding: 0 12px; }
  select:focus { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-2) 18%, transparent); }
  .fld { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; }
  .fld .star { color: var(--err); }
  .grid2 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 560px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
  .form { display: grid; gap: 14px; }
  .form .hint { font-weight: 400; }
  .err { color: var(--err); font-size: 14px; margin: 0; min-height: 1.2em; }
  .linkbox { display: flex; gap: 6px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; }
  [dir="rtl"] .linkbox { padding: 6px 12px 6px 6px; }
  .linkbox span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .pc { margin: 0 0 12px; }
  .pc .badge { white-space: normal; line-height: 1.5; padding-block: 4px; }
  .job { display: grid; gap: 4px; border-top: 1px solid var(--line); padding: 10px 0 2px; font-size: 14px; }
  .job:first-child { border-top: 0; }
  .note { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin: 0 0 14px; }
  ul.plain { margin: 4px 0 0; padding-inline-start: 18px; color: var(--muted); font-size: 14px; }
  .seg { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
  .seg button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 600; font-size: 14px; padding: 9px 12px; border-radius: 10px;
                cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
  .person { display: grid; gap: 8px; }
  .person .name { font-weight: 700; font-size: 15.5px; }
  .person .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .person .actions:empty { display: none; }
  .contact { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
  .codev { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 2px; font-weight: 700; }
  .btn.danger { color: var(--err); }
  .pick { display: flex; gap: 10px; align-items: flex-start; color: var(--ink); font-size: 14px; font-weight: 400; border-top: 1px solid var(--line); padding: 9px 0; margin: 0; }
  .pick input { width: 18px; height: 18px; margin-top: 3px; flex: none; }
  .tools-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tools-bar .q { flex: 2 1 220px; } .tools-bar .f { flex: 1 1 150px; }
  .count { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 16px; }
  dialog.sheet { border: 0; padding: 0; background: var(--surface); color: var(--ink); border-radius: 18px; width: min(680px, calc(100vw - 20px));
                 max-height: calc(100vh - 40px); box-shadow: 0 20px 60px rgba(0, 0, 0, .35); animation: rise .2s ease-out; }
  dialog.sheet::backdrop { background: rgba(8, 18, 28, .55); }
  dialog.sheet > * { padding: 20px; }
  @media (max-width: 600px) {
    dialog.sheet { width: 100vw; max-width: 100vw; max-height: 92vh; margin: auto 0 0; border-radius: 18px 18px 0 0; }
    dialog.sheet > * { padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
  }
  .scancode { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 12px; padding: 12px 14px; border-radius: 12px;
              background: var(--gold-soft); border: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); }
  .scancode > div { flex: 1 1 220px; }
  .scancode .code { font: 700 22px/1 ui-monospace, "Cascadia Mono", Consolas, monospace; letter-spacing: 3px; color: var(--ink); }
</style>

const ROLE = {scanner: 1, organizer: 2, admin: 3, super: 4};
const {el, svg, t} = UI, app = document.getElementById('app');
// as el(): what is left out (null, false) is not drawn, and lists are spread (the browser's own would print "null")
const replace0 = Element.prototype.replaceChildren;
Element.prototype.replaceChildren = function (...kids) { return replace0.apply(this, kids.flat(Infinity).filter(k => k != null && k !== false)); };
let session = UI.store.get(KEY) || '', me = null;  // me: the signed-in account, as the Apps Script sees it on each answer
const remember = s => { session = s; UI.store.set(KEY, s || null); };
const can = role => me && ROLE[me.role] >= ROLE[role];
const roleName = r => t({scanner: 'rScanner', organizer: 'rOrganizer', admin: 'rAdmin', super: 'rSuper'}[r]) || r;
const ic = (name, cls) => {  // an icon of the platform's set (the sprite at the top of <body>)
  const n = document.createElementNS('http://www.w3.org/2000/svg', 'svg'), u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  n.setAttribute('class', 'ic' + (cls ? ' ' + cls : ''));
  n.setAttribute('aria-hidden', 'true');
  u.setAttribute('href', '#i-' + name);
  n.append(u);
  return n;
};
const toast = msg => UI.toast(msg, 4000);
const when = s => { const d = new Date(s); return !s || isNaN(d) ? '' : UI.fmtDate(d, {dateStyle: 'medium', timeStyle: 'short'}); };

async function call(action, extra) {
  let j;
  try {
    const r = await fetch(EXEC, {method: 'POST', credentials: 'omit', body: JSON.stringify(Object.assign({action, session}, extra))});
    j = await r.json();
  } catch (e) { toast(t('net')); throw e; }
  if (j.status === 'login') { remember(''); showLogin(); throw new Error('login'); }
  if (j.status === 'role') { toast(t('noRole')); throw new Error('role'); }
  if (j.user) setMe(j.user);
  return j;
}

function showLogin(msg) {
  me = null;

  document.getElementById('appbar').replaceChildren();
  document.body.classList.remove('nav-open');
  const pw = el('input', {id: 'pw', type: 'password', autocomplete: 'current-password', dir: 'ltr', required: true});
  const login = el('input', {id: 'login', autocomplete: 'username', dir: 'ltr', required: true, autocapitalize: 'none', spellcheck: false});
  const eye = el('button', {type: 'button', className: 'eye', textContent: t('show'), onclick: () => {
    const shown = pw.type === 'password';
    pw.type = shown ? 'text' : 'password';
    eye.textContent = t(shown ? 'hide' : 'show');
  }});
  const err = el('p', {className: 'say', role: 'alert', textContent: msg || ''});
  const go = el('button', {className: 'go block', type: 'submit'}, ic('lock'), t('enter'));
  const form = el('form', {className: 'si-form', noValidate: true},
    el('h2', {textContent: t('siH')}), el('p', {className: 'hint', textContent: t('siD')}),
    el('label', {htmlFor: 'login', textContent: t('login')}), el('div', {className: 'field'}, ic('person'), login),
    el('label', {htmlFor: 'pw', textContent: t('password')}), el('div', {className: 'field'}, ic('lock'), pw, eye),
    go, err, el('p', {className: 'hint', textContent: t('siForgot')}),
    el('div', {className: 'links'}, ...[['index.html', 'nVerify'], ['me.html', 'nMeSite'], ['privacy.html', 'nPrivacy']].map(([href, key]) =>
      el('a', {href, textContent: t(key)}))));
  form.onsubmit = async e => {
    e.preventDefault();
    if (!login.value.trim()) return login.focus();
    if (!pw.value) return pw.focus();
    go.disabled = true;
    try {
      const j = await call('login', {login: login.value, password: pw.value});
      if (j.status === 'ok') { remember(j.session); return route(); }
      err.textContent = t({wrong: 'wrongLogin', locked: 'locked'}[j.status] || 'loginFail');
    } catch (x) { /* toast shown */ } finally { go.disabled = false; }

  const box = document.getElementById('signin');
  box.replaceChildren(el('div', {className: 'tools'}, UI.langSwitch(), UI.themeButton()),

      el('div', {className: 'si-brand'}, el('span', {className: 'seal'}, ic('seal')),

        el('ul', {}, ...['siF1', 'siF2', 'siF3'].map(k => el('li', {}, ic('check'), t(k))))),
      form));
  box.hidden = false;
  UI.paint(box);
  login.focus();
}

// new activity (a null), made here with its Google form, or its details changed (its form's title and text follow)
function activityForm(ch, a, done, close) {
  if (!ch) return el('div', {className: 'form'}, el('p', {className: 'note', textContent: t('noChoices')}), el('div', {className: 'row end'}, btn(t('cancel'), close, 'ghost')));
  const inputs = {}, v = a || {sessions: 1, tickets: ch.tickets, lang: ch.lang};
  const f = (k, label, props) => { const [l, i] = field(label, Object.assign({value: v[k] == null ? '' : v[k]}, props)); inputs[k] = i; return l; };
  const s = (k, label, opts) => { inputs[k] = select(opts, v[k] == null ? opts[0][0] : v[k]); return labelled(label, inputs[k]); };
  const kinds = ch.kinds.map(k => [k, k]);
  if (a && a.kind && !ch.kinds.includes(a.kind)) kinds.unshift([a.kind, a.kind]);
  const err = el('p', {className: 'err', role: 'alert'});
  const save = el('button', {className: 'btn', type: 'submit', textContent: t(a ? 'askEdit' : 'askNew')});
  const form = el('form', {className: 'form', noValidate: true}, el('h2', {textContent: t(a ? 'editT' : 'newT')}),
    f('title', t('fTitle'), {required: true, maxLength: 200}),
    el('div', {className: 'grid2'}, s('kind', t('fKind'), kinds), a ? null : s('org_id', t('fOrg'), ch.orgs.map(o => [o.id, o.name]))),
    a ? null : el('div', {className: 'grid2'}, s('lang', t('fLang'), [['ar', t('langAr')], ['fr', t('langFr')], ['en', t('langEn')]]),
      s('cert_type', t('fType'), ch.types.map(x => [x, x]))),
    el('div', {className: 'grid2'}, f('dates', t('fDates'), {placeholder: t('datesPh')}), f('hours', t('fHours'))),
    f('place', t('fPlace')),
    el('div', {className: 'grid2'}, f('sessions', t('fSessions'), {type: 'number', min: 1, max: 60}),
      f('min_sessions', t('fMin'), {type: 'number', min: 1, max: 60, placeholder: t('minPh')})),
    el('div', {className: 'grid2'}, f('tickets', t('fTickets'), {type: 'number', min: 0, max: 2000}), f('whatsapp', t('fWa'), {dir: 'ltr', type: 'url'})),
    a || !ch.templates.length ? null : s('template', t('fTpl'), [['', t('noTpl')], ...ch.templates.map(x => [x.id, x.name])]),
    el('p', {className: 'hint', textContent: t(a ? 'editHint' : 'newHint')}),
    el('div', {className: 'row'}, save, btn(t('cancel'), close, 'ghost')), err);
  form.onsubmit = async e => {
    e.preventDefault();
    const data = {};
    Object.entries(inputs).forEach(([k, x]) => { const val = x.value.trim(); if (val !== '' && (!a || val !== String(v[k] == null ? '' : v[k]))) data[k] = val; });
    if (a && !Object.keys(data).length) return close();
    save.disabled = true;
    err.textContent = a ? '' : t('making');
    try {
      const r = await call('actsave', a ? {id: a.id, data} : {data});
      if (r.status === 'ok') { toast(r.form === 'fail' ? t('formFail') + (r.error ? ' — ' + r.error : '') : t(a ? 'saved' : 'madeAct')); return done(r.id); }
      err.textContent = t({notitle: 'notitle', nochoices: 'noChoices', org: 'badOrg', bad: 'badVal'}[r.status] || 'saveFail');
    } catch (x) { err.textContent = ''; /* toast shown */ }
    save.disabled = false;
  };
  return form;
}

// one person (an organizer, a speaker...) given certificates in several past activities at once, then one message
function bundleForm(ch, acts, done, close) {
  if (!ch) return activityForm(ch, null, done, close);
  const inputs = {}, picked = new Set(), answers = {};
  const fld = (k, label, props) => { const [l, i] = field(label, props); inputs[k] = i; return l; };

const AR_DIGITS = s => s.replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

// one text field on a canvas at `scale` canvas pixels per PDF point
async function drawText(ctx, k, f, text, lang, scale) {
  if (!text) return;
  text = String(text);
  if (f.digits === 'arabic') text = AR_DIGITS(text);
  const rtl = !LATIN_FIELDS.includes(k) && lang === 'ar', fam = await useFont(f.font || '');
  const w = (Number(f.w) || 400) * scale, lines = Number(f.lines) || 1;
  let size = (Number(f.size) || 20) * scale;
  const font = s => (f.bold ? 'bold ' : '') + s + 'px "' + fam + '", sans-serif';
  const wrap = s => {  // the words in lines of at most w
    ctx.font = font(s);
    if (lines === 1) return [text];
    const out = [];
    let cur = '';
    text.split(/\s+/).forEach(word => { const t = cur ? cur + ' ' + word : word; if (cur && ctx.measureText(t).width > w) { out.push(cur); cur = word; } else cur = t; });
    if (cur) out.push(cur);
    return out;
  };
  let ls = wrap(size);
  for (let i = 0; i < 40 && (ls.length > lines || Math.max(...ls.map(l => ctx.measureText(l).width)) > w); i++) { size *= .95; ls = wrap(size); }
  ctx.save();

  ctx.direction = rtl ? 'rtl' : 'ltr';

  const full = (Number(f.size) || 20) * scale;  // the box's top stays where the field's full size puts it (as MuPDF's htmlbox)
  const top = lines === 1 ? f.y * scale - full * .75 : f.y * scale - full * 1.4 * lines / 2;
  ls.forEach((l, i) => ctx.fillText(l, ax, top + size * 1.05 + i * size * 1.4));
  ctx.restore();
}

async function drawQr(ctx, f, url, scale) {  // the verification link as a QR code, at its square
  await lib('qr');
  const q = qrcode(0, 'M');
  q.addData(url || 'https://cdcue.github.io/verify/');
  q.make();
  const n = q.getModuleCount(), side = f.size * scale, cell = side / (n + 2), x0 = f.x * scale - side / 2, y0 = f.y * scale - side / 2;

}

// the certificate as a PDF: the design as it is, the texts and QR drawn over it as one picture (the browser shapes Arabic)

  const scale = Math.min(4, 3600 / Math.max(width, height)), c = el('canvas', {width: Math.round(width * scale), height: Math.round(height * scale)});
  await drawCertificate(c.getContext('2d'), layout, values, scale);

async function drawCertificate(ctx, layout, values, scale) {
  for (const [k, f] of Object.entries(layout)) {
    if (k === 'qr') { await drawQr(ctx, f, values.qr, scale); continue; }
    if (k.startsWith('img')) {  // logo, signature, stamp: width given, height from the picture's proportions (as the app)
      const w = (Number(f.w) || 100) * scale, h = w * (Number(f.ar) || 1);

    await drawText(ctx, k, f, text, values.lang, scale);

async function designPdf(file) {

  await lib('pdflib');
  const doc = await PDFLib.PDFDocument.create();

    if (bytes.length <= 3e6 && src.numPages === 1) return bytes;

function saveXlsx(name, sheets) {  // [[sheet name, rows]] as a file the browser downloads; text stays text (never a formula)
  const wb = XLSX.utils.book_new();
  sheets.forEach(([n, rows]) => {
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = rows[0].map(() => ({wch: 24}));
    XLSX.utils.book_append_sheet(wb, ws, n);
  });
  wb.Workbook = {Views: [{RTL: true}]};
  XLSX.writeFile(wb, name);
}

// what a column of any file is, from its title (and the script of its values, for names), as the app's guess_field
const GUESS = [['email', ['mail', 'بريد', 'courriel']], ['phone', ['هاتف', 'tel', 'phone', 'gsm', 'واتساب', 'whatsapp', 'mobile']], ['ticket', ['بطاقة', 'ticket']],
  ['gender', ['جنس', 'genre', 'sexe', 'gender', 'civilit']], ['mention', ['ميزة', 'نتيجة', 'mention', 'note', 'result']], ['cert_type', ['نوع الشهادة']],
  ['attended', ['حصص', 'séances', 'sessions']], ['present', ['حاضر', 'حضور', 'présen', 'presen']],
  ['full', ['الكامل', 'complet', 'full', 'الاسم والنسب', 'nom et prénom', 'nom & prénom']], ['first', ['الشخصي', 'prénom', 'prenom', 'first']],
  ['last', ['العائلي', 'النسب', 'nom', 'last', 'famille', 'surname']], ['full', ['الاسم', 'name']]];
function guessField(head, samples, taken) {
  const h = String(head).trim().toLowerCase(), s = samples.some(v => /[؀-ۿ]/.test(v)) ? 'ar' : 'lat';
  for (const [f, words] of GUESS) {
    const k = ['full', 'first', 'last'].includes(f) ? f + '_' + s : f;
    if (words.some(w => h.includes(w)) && !taken.has(k)) return k;
  }
  return '';
}

const CIVILITY = /^\s*(السيد\s*\(ة\)|السيدة|السيد|monsieur|madame|mme|mlle|mr\.?|m\.)\s+/i;
const GENDER_WORDS = {m: 'm', f: 'f', 'ذكر': 'm', 'أنثى': 'f', h: 'm', homme: 'm', 'm.': 'm', male: 'm', femme: 'f', mme: 'f', female: 'f', 'السيد': 'm', 'السيدة': 'f',
  monsieur: 'm', mr: 'm', 'mr.': 'm', madame: 'f', mlle: 'f'};
function importRow(map, r) {  // one row as the server takes it, or null when it is empty
  const v = {};
  map.forEach((k, i) => { if (k) v[k] = String(r[i] == null ? '' : r[i]).trim(); });
  if (!Object.values(v).some(Boolean)) return null;
  for (const s of ['ar', 'lat']) {  // one "full name" column: its title (السيدة, Mme...) gives the gender, then first word and the rest
    if (!('full_' + s in v)) continue;
    let full = v['full_' + s];
    delete v['full_' + s];
    const c = full.match(CIVILITY);
    if (c) {
      full = full.slice(c[0].length);
      if (!v.gender) v.gender = GENDER_WORDS[c[1].toLowerCase()] || '';
    }
    if (full && !v['first_' + s] && !v['last_' + s]) [v['first_' + s], v['last_' + s]] = [full.split(/\s+/)[0], full.split(/\s+/).slice(1).join(' ')];
  }
  const out = {};
  Object.entries(v).forEach(([k, x]) => {
    if (k.startsWith('x:')) (out.x = out.x || {})[k.slice(2)] = x;
    else if (k === 'gender') { if (GENDER_WORDS[x.toLowerCase()]) out.gender = GENDER_WORDS[x.toLowerCase()]; }
    else if (k === 'present') out.present = ['نعم', '1', 'x', 'yes', 'oui', 'true', '✓'].includes(x.toLowerCase());
    else if (k === 'attended') out.attended = (x.match(/\d+/g) || []).map(Number);
    else if (k === 'cert_type') { if (x) out.type = x; }
    else out[k] = x;
  });
  return out;
}

function importSheet(a, close, reload) {
  const file = el('input', {type: 'file', accept: '.xlsx,.xls,.csv,.ods', ariaLabel: t('dImport')}), box = el('div'), say = el('p', {className: 'hint'});
  file.onchange = async () => {
    say.textContent = '';
    box.replaceChildren();
    let rows;
    try {
      await lib('xlsx');
      const wb = XLSX.read(await file.files[0].arrayBuffer());
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, defval: '', raw: false}).map(r => r.map(c => String(c).trim()));
    } catch (e) { say.textContent = t('imBad'); return; }
    while (rows.length && rows[0].filter(Boolean).length < 2) rows.shift();  // a title line above the headers
    rows = rows.filter((r, i) => !i || r.some(Boolean)).slice(0, 3001);
    if (rows.length < 2) { say.textContent = t('imEmpty'); return; }
    const head = rows[0], qs = a.questions || [], F = t('imFields');
    const exact = {};
    XL_COLS.forEach(([k, l]) => { if (IM_FIELDS.includes(k)) exact[l] = exact[k] = k; });
    qs.forEach(q => { exact[q.title] = 'x:' + q.key; });
    const taken = new Set(), map = head.map(h => exact[h] && !taken.has(exact[h]) ? (taken.add(exact[h]), exact[h]) : null);
    head.forEach((h, i) => { if (map[i] === null) taken.add(map[i] = guessField(h, rows.slice(1, 6).map(r => r[i] || '').filter(Boolean), taken)); });
    const fields = [...IM_FIELDS.map(k => [k, F[k]]), ...qs.map(q => ['x:' + q.key, q.title])];
    const sels = head.map((h, i) => el('select', {ariaLabel: h || t('imCol')}, el('option', {value: '', textContent: t('imSkip')}),
      ...fields.map(([k, l]) => el('option', {value: k, selected: map[i] === k, textContent: l}))));
    const go = el('button', {type: 'button', className: 'lg'}, ic('plus'), t('imGo')(rows.length - 1));
    go.onclick = async () => {
      const m = sels.map(s => s.value);
      if (!m.some(k => /^(id|(first|last|full)_(ar|lat))$/.test(k))) return toast(t('imNoName'));
      const data = rows.slice(1).map(r => importRow(m, r)).filter(Boolean), sum = {added: 0, updated: 0, issued: 0, skipped: 0};
      go.disabled = true;
      for (let i = 0; i < data.length; i += 400) {
        const r = await call('importrows', {id: a.id, rows: data.slice(i, i + 400)}).catch(() => ({}));
        if (r.status !== 'ok') {  // what went in stays in, and the message says how much (a new try would add those rows again)
          toast(t('reqFail') + (sum.added + sum.updated ? ' — ' + t('imDone')(sum) : ''));
          go.disabled = false;
          return;
        }
        Object.keys(sum).forEach(k => { sum[k] += r[k] || 0; });
      }
      toast(t('imDone')(sum));
      close();
      reload();
    };
    box.replaceChildren(el('div', {className: 'tablewrap'}, el('table', {},
      el('thead', {}, el('tr', {}, el('th', {textContent: t('imCol')}), el('th', {textContent: t('imEx')}), el('th', {textContent: t('imIs')}))),
      el('tbody', {}, ...head.map((h, i) => el('tr', {}, el('td', {dir: 'auto', textContent: h}),
        el('td', {className: 'muted', dir: 'auto', textContent: rows.slice(1, 4).map(r => r[i]).filter(Boolean).join(' · ')}), el('td', {}, sels[i])))))),
      el('div', {className: 'bar', style: 'margin-top:12px'}, go));
  };
  return el('div', {}, el('h2', {className: 'ch'}, ic('sheet'), t('dImport')), el('p', {className: 'muted', textContent: t('imD')}),
    el('div', {className: 'bar'}, file, btn(t('imTpl'), () => templateXlsx(a), 'ghost')), say, box,
    el('div', {className: 'bar', style: 'margin-top:12px'}, btn(t('close'), close, 'ghost')));
}

async function redrawCert(a, p) {  // an issued certificate drawn again (a correction): the same number, file and link
  const d = await withPictures(await call('designget', {id: a.id, type: p.type || a.cert_type}));
  if (d.status !== 'ok' || !d.file) return 'design';
  const pdf = await certificatePdf(unb64(d.file), d.layout, certValues(a, p, answersOf(a, p)));
  return (await call('refile', {id: a.id, uid: p.uid, pdf: b64(new Uint8Array(pdf))})).status;
}

async function issueOne(a, p, d) {  // one certificate: its number (given once, kept), then its file drawn here; returns its link
  const n = await call('issuenum', {id: a.id, uid: p.uid});
  if (n.status !== 'ok') throw new Error(n.status);
  if (n.file) return p.link || '';
  const pdf = await certificatePdf(d.bytes, d.layout, certValues(a, Object.assign({}, p, {serial: n.serial, code: n.code}), answersOf(a, p)));
  const f = await call('issuefile', {id: a.id, uid: p.uid, pdf: b64(new Uint8Array(pdf))});
  if (f.status !== 'ok') throw new Error(f.status);
  return f.link;
}

// a picture loaded (its load event: decode() can hang in some browsers), or a refusal
const loadImg = src => new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => bad(new Error('image')); im.src = src; });

async function withPictures(r) {  // a design as designget sends it, its pictures ready to draw
  for (const [k, p] of Object.entries(r.pics || {})) {
    if (!r.layout[k]) continue;
    const im = await loadImg('data:' + p.mime + ';base64,' + p.data).catch(() => null);  // drawn without it when unreadable
    if (im) r.layout[k]._img = im;
  }
  return r;
}

async function pngOf(file) {  // a picture as PNG bytes (at most 1500 px), and its height / width
  const url = URL.createObjectURL(file), im = await loadImg(url).finally(() => URL.revokeObjectURL(url));
  const k = Math.min(1, 1500 / Math.max(im.naturalWidth, im.naturalHeight)), c = el('canvas', {width: Math.round(im.naturalWidth * k), height: Math.round(im.naturalHeight * k)});
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return {data: c.toDataURL('image/png').split(',')[1], ar: c.height / c.width, img: c};
}

async function allCertificates(a, people) {  // every valid certificate in one PDF (to print for a ceremony), put together here
  const ps = people.filter(p => p.serial && !p.revoked && /^https:/.test(p.link || '')).sort(byNum('serial'));
  if (!ps.length) return toast(t('allNone'));
  await lib('pdflib');
  const out = await PDFLib.PDFDocument.create();
  for (const [i, p] of ps.entries()) {
    toast(t('allRun')(i + 1, ps.length));
    const r = await call('certfile', {id: a.id, uid: p.uid}).catch(() => ({}));
    if (r.status !== 'ok') continue;  // imported old ones have no file here
    const src = await PDFLib.PDFDocument.load(unb64(r.pdf));
    (await out.copyPages(src, src.getPageIndices())).forEach(pg => out.addPage(pg));
  }
  const url = URL.createObjectURL(new Blob([await out.save()], {type: 'application/pdf'}));
  el('a', {href: url, download: 'certificates-' + a.id + '.pdf'}).click();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function webIssue(a, todo, reload) {  // the present people without a certificate, issued one by one from this page
  const box = el('div', {className: 'card'}, el('h2', {className: 'ch'}, ic('cert'), t('wbT')), el('p', {className: 'muted', textContent: t('dzLoading')}));

    for (const ty of types) {

      designs[ty] = ready ? {bytes: unb64(r.file), layout: r.layout} : null;

    const go = ((a.choices || {}).issue || {}).verify_url ? todo.filter(p => designs[p.type || a.cert_type]) : [];

// a preset's places on this background: scaled to its page, its questions only if this activity asks them, the pictures this
// design has moved to the preset's places (the others stay). The computer's studio applies them the same way (activity.html).
function applyPreset(p, layout, page, questions) {
  const sx = page[0] / (p.w || page[0]), sy = page[1] / (p.h || page[1]), r = v => Math.round(v * 10) / 10, out = {};
  for (const [k, f] of Object.entries(p.layout || {})) {
    if (k.startsWith('x:') && !questions.includes(k.slice(2))) continue;
    if (k.startsWith('img')) { if (layout[k]) out[k] = Object.assign({}, layout[k], {x: r(f.x * sx), y: r(f.y * sy), w: r((f.w || layout[k].w) * sx)}); continue; }
    out[k] = Object.assign({}, f, {x: r(f.x * sx), y: r(f.y * sy), size: r(f.size * sx)}, f.w ? {w: r(f.w * sx)} : {});
  }
  Object.keys(layout).filter(k => k.startsWith('img') && !out[k]).forEach(k => { out[k] = layout[k]; });
  return out;
}

      ariaPressed: String(v === tl), onclick: e => { tl = v; drawTexts(); seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === e.target))); }})));
    drawTexts();
    const go = btn(t('setSave'), async () => {
      go.disabled = true;
      const r = await call('settingssave', {data: {kinds: kinds.value, cert_types: types.value, default_lang: lang.value, default_tickets: tickets.value,
        civ_on_cert: civ.checked, mail_attach: attach.checked, texts,
        templates: tpls.map(x => ({id: x.id, name: x.name.value, questions: x.qs.map(q => q.read())}))}}).catch(() => ({}));
      go.disabled = false;
      toast(r.status === 'ok' ? t('setSaved') : r.status === 'types' ? t('setNoTypes') : t('saveFail'));
      if (r.status === 'ok') showOrg();
    });
    const tpls = S.templates.map(x => ({id: x.id, name: el('input', {value: x.name, dir: 'auto'}), qs: x.questions.map(questionFields)}));
    const tplBox = el('div');
    const drawTpls = () => tplBox.replaceChildren(...tpls.map((x, i) => el('div', {className: 'card flat', style: 'margin:8px 0'},
      el('div', {className: 'bar'}, labelled(t('tplName'), x.name), el('span', {className: 'sp'}), btn(t('tplDel'), () => { tpls.splice(i, 1); drawTpls(); }, 'ghost danger')),
      ...x.qs.map((q, j) => el('div', {style: 'border-top:1px solid var(--line);padding-top:8px;margin-top:8px'}, q.node,
        btn(t('del'), () => { x.qs.splice(j, 1); drawTpls(); }, 'ghost danger'))),
      btn(t('qAdd'), () => { x.qs.push(questionFields({})); drawTpls(); }, 'sec'))),
      btn(t('tplAdd'), () => { tpls.push({id: Date.now() % 1e9, name: el('input', {dir: 'auto'}), qs: []}); drawTpls(); }, 'sec'));
    drawTpls();
    blocks.push(el('div', {className: 'card'}, el('h2', {className: 'ch'}, ic('form'), t('tplT')), el('p', {className: 'muted', style: 'margin-top:0', textContent: t('tplD')}), tplBox));
    blocks.push(el('div', {className: 'card'}, el('h2', {className: 'ch'}, ic('gear'), t('setT')), el('p', {className: 'muted', style: 'margin-top:0', textContent: t('setD')}),
      labelled(t('setKinds'), kinds), labelled(t('setTypes'), types), el('p', {className: 'hint', textContent: t('setTypesD')}),
      el('div', {className: 'grid2'}, labelled(t('setLang'), lang), labelled(t('setTickets'), tickets)),
      el('label', {className: 'row', style: 'gap:8px'}, civ, t('setCiv')), el('label', {className: 'row', style: 'gap:8px;margin-top:6px'}, attach, t('setAttach')),
      el('h3', {style: 'margin:18px 0 6px', textContent: t('setTexts')}), el('p', {className: 'hint', style: 'margin-top:0', textContent: t('setTextsD')}), seg, tbox,
      el('div', {className: 'bar', style: 'margin-top:12px'}, go)));
  }
  app.replaceChildren(...blocks);
}

function myPasswordCard() {  // one's own password: checked here, changed by the computer within a minute (the same on both)
  const [of, old] = field(t('pwOldL'), {type: 'password', autocomplete: 'current-password', required: true, dir: 'ltr'});
  const [nf, pw] = field(t('pwNewL'), {type: 'password', autocomplete: 'new-password', required: true, minLength: 8, dir: 'ltr'});
  const [rf, pw2] = field(t('pwNew2'), {type: 'password', autocomplete: 'new-password', required: true, minLength: 8, dir: 'ltr'});
  const say = el('p', {className: 'say', role: 'alert'});
  const go = el('button', {type: 'submit', className: 'sm'}, t('pwChange'));
  const f = el('form', {className: 'card form', noValidate: true}, el('h2', {className: 'ch'}, ic('person'), t('myT')),
    el('p', {className: 'muted', style: 'margin:0'}, el('b', {dir: 'auto', textContent: me.name}), ' · ', el('span', {className: 'ltr', textContent: me.login}), ' · ', roleName(me.role)),
    of, el('div', {className: 'grid2'}, nf, rf), el('div', {className: 'bar'}, go), say);
  f.onsubmit = async e => {
    e.preventDefault();
    if (pw.value.length < 8) { say.textContent = t('shortNew'); return pw.focus(); }
    if (pw.value !== pw2.value) { say.textContent = t('pwMismatch'); return pw2.focus(); }
    go.disabled = true;
    const r = await call('mypassword', {old: old.value, password: pw.value}).catch(() => ({}));
    go.disabled = false;
    if (r.status === 'ok') { old.value = pw.value = pw2.value = ''; say.textContent = ''; return toast(t('pwSent')); }
    say.textContent = t({wrong: 'wrongPw', short: 'shortNew'}[r.status] || 'saveFail');
  };
  return f;
}

async function showUsers() {  // the platform's accounts page: each change a request the computer carries out within a minute
  mark('users'); bar(t('nUsers')); loading();
  const [j, h] = await Promise.all([call('users'), call('activities')]);
  if (j.status !== 'ok') return showList();
  const orgs = ((h.choices || {}).orgs || []), boss = can('super');
  const roles = Object.keys(ROLE).filter(r => boss || ROLE[r] < ROLE.admin).reverse();
  const roleSel = (v, name) => el('select', {name, ariaLabel: t('uRole'), style: 'min-width:130px'}, ...roles.map(r => el('option', {value: r, selected: r === v, textContent: roleName(r)})));
  const orgSel = (v, name) => el('select', {name, ariaLabel: t('nOrg'), style: 'min-width:110px'}, el('option', {value: '', textContent: '—'}),
    ...orgs.map(o => el('option', {value: o.id, selected: String(o.id) === String(v), textContent: o.code || o.name})));
  const said = (r, ok) => { if (r.status === 'ok') { toast(t(ok)); return showUsers(); }
    toast(t({role: 'noRole', self: 'selfNo', org: 'orgNeed', short: 'shortNew', badnew: 'badnew', taken: 'taken'}[r.status] || 'saveFail')); };
  const rows = j.users.map(u => {
    const mine = u.login === me.login, locked = !boss && ROLE[u.role] >= ROLE.admin;
    const name = el('input', {value: u.name, ariaLabel: t('uName'), disabled: locked}), pw = el('input', {type: 'password', placeholder: t('unchanged'), autocomplete: 'new-password',
      ariaLabel: t('newPw'), dir: 'ltr', disabled: locked, style: 'min-width:130px'});
    const role = mine || locked ? null : roleSel(u.role), org = boss && !mine ? orgSel(u.org) : null;
    const act = mine || locked ? null : el('select', {ariaLabel: t('stateL')}, el('option', {value: '1', selected: u.active, textContent: t('accOpenO')}),
      el('option', {value: '0', selected: !u.active, textContent: t('accCloseO')}));
    const save = locked ? null : btn(t('saveRow'), async e => {
      e.target.disabled = true;
      const r = await call('staffsave', {id: u.id, name: name.value, role: role ? role.value : u.role, org: org ? org.value : u.org, password: pw.value,
        active: act ? act.value === '1' : u.active}).catch(() => ({}));
      e.target.disabled = false;
      said(r, 'staffSent');
    }, 'sec');
    return el('tr', {style: u.active ? '' : 'opacity:.6'},
      el('td', {className: 'c-name'}, name), el('td', {className: 'ltr', dataset: {l: t('login')}, textContent: u.login}),
      el('td', {dataset: {l: t('uRole')}}, role || roleName(u.role)),
      boss ? el('td', {dataset: {l: t('nOrg')}}, org || (u.orgName || t('allOrgs'))) : null,
      el('td', {dataset: {l: t('newPw')}}, pw),
      el('td', {dataset: {l: t('stateL')}}, act || el('span', {className: 'badge ' + (u.active ? 'ok' : ''), textContent: t(u.active ? 'accOpenO' : 'accCloseO')})),
      el('td', {className: 'c-edit'}, save));
  });
  const [nf, nName] = field(t('fullName'), {required: true}), [lf, nLogin] = field(t('login'), {required: true, dir: 'ltr', autocapitalize: 'none', spellcheck: false, placeholder: 'ali.b'});
  const [pf, nPw] = field(t('pwMin'), {type: 'password', required: true, minLength: 8, autocomplete: 'new-password', dir: 'ltr'});
  const nRole = roleSel('organizer'), nOrg = boss ? orgSel(boss ? '' : me.org) : null;
  const add = el('form', {className: 'card form', noValidate: true}, el('h2', {className: 'ch'}, ic('plus'), t('newAccT')),
    el('div', {className: 'grid2'}, nf, lf), el('div', {className: 'grid2'}, pf, labelled(t('uRole'), nRole)), nOrg ? labelled(t('nOrg'), nOrg) : null,
    el('div', {className: 'bar'}, el('button', {type: 'submit'}, t('createAcc'))));
  add.onsubmit = async e => {
    e.preventDefault();
    const r = await call('staffsave', {login: nLogin.value, name: nName.value, role: nRole.value, org: nOrg ? nOrg.value : me.org, password: nPw.value}).catch(() => ({}));
    said(r, 'staffSent');
  };
  const reqs = (h.jobs || []).filter(x => x.kind === 'staff');
  app.replaceChildren(
    el('div', {className: 'grid2'}, myPasswordCard(),
      el('div', {className: 'card'}, el('h2', {className: 'ch'}, ic('people'), t('rolesT')),
        el('ul', {className: 'muted', style: 'margin:0;padding-inline-start:18px;line-height:1.9'}, ...t('rolesItems').map(x => el('li', {textContent: x}))))),
    el('section', {className: 'card'}, el('h2', {className: 'ch'}, ic('people'), t('nUsers') + ' (' + j.users.length + ')'),
      el('p', {className: 'muted', style: 'margin-top:0', textContent: t('usersHow')}), pcLine(h.pc),
      el('div', {className: 'tablewrap'}, el('table', {className: 'cards', style: 'min-width:820px'},
        el('thead', {}, el('tr', {}, ...[t('uName'), t('login'), t('uRole'), ...(boss ? [t('nOrg')] : []), t('newPw'), t('stateL'), ''].map(x => el('th', {textContent: x})))),
        el('tbody', {}, ...rows))),
      reqs.length ? el('div', {style: 'margin-top:12px'}, el('h3', {textContent: t('pendingReq')}), jobList(reqs)) : null),
    add);
}

async function showMe() {
  mark('me'); bar(t('nMe'));
  if (!me) { loading(); await call('activities'); }  // opened directly: the answer names the account
  const choice = (opts, value, pick) => el('div', {className: 'seg'}, ...opts.map(([v, key]) => el('button', {type: 'button', textContent: t(key),
    ariaPressed: String(v === value), onclick: e => { pick(v); e.target.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === e.target))); }})));
  const blocks = [el('section', {className: 'card rise'}, el('p', {className: 'hint', style: 'margin:0', textContent: t('signedAs')}),
    el('div', {className: 'row'}, el('span', {className: 'name grow', dir: 'auto', style: 'font-size:18px;font-weight:700', textContent: me.name}),
      el('span', {className: 'badge', textContent: roleName(me.role)}), el('span', {className: 'hint ltr', textContent: me.login})),
    el('div', {className: 'grid2', style: 'margin-top:16px'},
      labelled(t('language'), choice([['ar', 'langAr'], ['fr', 'langFr'], ['en', 'langEn']], UI.lang, l => UI.setLang(l))),
      labelled(t('theme'), choice([['auto', 'thAuto'], ['light', 'thLight'], ['dark', 'thDark']], UI.theme, v => UI.setTheme(v)))))];
  blocks.push(myPasswordCard());
  blocks.push(el('div', {className: 'section'}, el('button', {className: 'btn danger', type: 'button', textContent: t('logout'), onclick: signOut})));
  app.replaceChildren(...blocks);
}

function route() {
  if (!session) return showLogin();
  const h = location.hash, m = h.match(/^#a(\d+)(?:\/(\w+))?$/);
  if (h === '#pw') { location.hash = '#me'; return; }  // the old address of the password page
  const go = m ? () => showActivity(m[1], m[2])
    : h.startsWith('#search') ? () => showSearch(decodeURIComponent(h.slice(8)))
    : {'#users': showUsers, '#parts': showParticipants, '#me': showMe, '#stats': showStats, '#org': showOrg, '#bundle': () => showList(newBundle)}[h] || (() => showList());
  scrollTo(0, 0);
  go().catch(e => { if (e.message === 'role') location.hash = '#'; });  // a page this role does not open: home, not a page left loading
}
UI.init({page: 'dashboard', name: 'dash', shell: false, T, onLang: () => { if (me) { frame(); route(); } else if (!session) showLogin(); }});
addEventListener('hashchange', route);
route();
</script>
