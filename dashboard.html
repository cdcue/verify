<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';
  connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; form-action 'none'">
<title>لوحة المنظمين · منصة الشواهد</title>
<style>
  :root { --bg:#f3f5f8; --surface:#fff; --ink:#13202e; --muted:#5d6b7a; --line:#e2e7ee; --brand:#0b3b5c; --gold:#c8962f;
          --ok:#12804a; --ok-soft:#e8f6ee; --warn:#a05a00; --warn-soft:#fff4e2; --err:#b42318; --err-soft:#fdecea; --pri:#1d4ed8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#0d141c; --surface:#141e29; --ink:#e8eef4; --muted:#9aa8b6; --line:#24323f; --brand:#6fb3e4; --gold:#e2b65a;
    --ok:#4cc48a; --ok-soft:#12291f; --warn:#f0b35a; --warn-soft:#2d2313; --err:#f2867c; --err-soft:#2e1716; --pri:#8cc4ec; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Segoe UI", Tahoma, sans-serif; }
  header { background:#0b1f3a; color:#fff; padding:10px 16px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:sticky; top:0; z-index:3; }
  header b { font-size:17px; flex:1; min-width:160px; }
  header button { background:transparent; color:#cbd5e1; border:1px solid #3b4b63; border-radius:8px; padding:4px 10px; font:inherit; font-size:13px; cursor:pointer; }
  header .who { font-size:12px; color:#cbd5e1; }
  main { max-width:900px; margin:0 auto; padding:14px 16px 40px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  a.card { display:block; color:inherit; text-decoration:none; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:17px; margin:0 0 6px; }
  .muted { color:var(--muted); font-size:13px; }
  .nums { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:10px; }
  .nums.five { grid-template-columns:repeat(5, 1fr); }
  .nums div { background:var(--bg); border-radius:10px; padding:6px; text-align:center; font-size:12px; color:var(--muted); }
  .nums b { display:block; font-size:19px; color:var(--ink); }
  .badge { display:inline-block; padding:1px 8px; border-radius:20px; font-size:12px; font-weight:600; background:var(--bg); color:var(--muted); margin:2px 0; }
  .badge.ok { background:var(--ok-soft); color:var(--ok); } .badge.warn { background:var(--warn-soft); color:var(--warn); }
  .badge.err { background:var(--err-soft); color:var(--err); }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; background:var(--surface); color:var(--ink); }
  button.act { background:var(--pri); color:#fff; border:0; border-radius:9px; padding:7px 12px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; }
  button.act.sec { background:var(--bg); color:var(--ink); border:1px solid var(--line); }
  button:disabled { opacity:.5; }
  .bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .person { display:grid; gap:4px; }
  .person .top { display:flex; gap:8px; align-items:baseline; }
  .person .top b { flex:1; }
  .ltr { direction:ltr; unicode-bidi:embed; }
  .code { font-family:ui-monospace, Consolas, monospace; letter-spacing:2px; font-weight:700; }
  #login { max-width:380px; margin:60px auto; display:grid; gap:10px; }
  .note { background:var(--warn-soft); color:var(--warn); border-radius:10px; padding:8px 12px; font-size:13px; margin-bottom:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  label { display:grid; gap:2px; font-size:13px; color:var(--muted); }
  .link { display:flex; gap:6px; align-items:center; background:var(--bg); border-radius:10px; padding:6px 10px; margin:6px 0; }
  .link span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  label.pick { display:flex; gap:8px; align-items:center; color:var(--ink); font-size:14px; border-top:1px solid var(--line); padding:7px 0; }
  label.pick input { width:auto; }
  .job { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:6px; margin-top:6px; font-size:14px; }
  .pc { font-size:13px; margin-bottom:12px; }
  ul.pconly { margin:6px 0 0; padding-inline-start:18px; color:var(--muted); font-size:14px; }
  #toast { position:fixed; bottom:16px; inset-inline:16px; background:#0b1f3a; color:#fff; border-radius:12px; padding:12px 14px; display:none; z-index:5; }
  @media (max-width:520px) { .nums.five { grid-template-columns:repeat(3, 1fr); } .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><b>لوحة المنظمين · منصة الشواهد</b><span class="who" id="who"></span>
  <button id="back" hidden>→ الأنشطة</button><button id="users" hidden>الحسابات</button><button id="pw" hidden>كلمة السر</button><button id="out" hidden>خروج</button></header>
<main id="app"></main>
<div id="toast"></div>
<script>
  const EXEC = 'https://script.google.com/macros/s/AKfycbyhQdedASgHUcB7vIZ6mAtgzy1fo6TFTa0bGybYmjnnU5JV79VRCzwudv8wMSJnL71i/exec';
  const app = document.getElementById('app'), KEY = 'shawahid-dashboard';
  const ROLE = {scanner: 1, organizer: 2, admin: 3}, ROLE_NAME = {scanner: 'ماسح', organizer: 'منظم', admin: 'مسؤول'};
  const JOB = {sync: 'مزامنة', issue: 'إصدار الشواهد', email: 'إرسال الشواهد بالبريد', activity: 'نشاط جديد', update: 'تعديل النشاط', bundle: 'شواهد لشخص في عدة أنشطة'};
  let session = (() => { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } })();
  let me = null;  // the signed-in account, as the Apps Script sees it on each answer
  const remember = s => { session = s; try { s ? localStorage.setItem(KEY, s) : localStorage.removeItem(KEY); } catch (e) {} };
  const can = role => me && ROLE[me.role] >= ROLE[role];
  // every value comes from the registration form or the sheets: text nodes only, never HTML
  function el(tag, props, ...kids) {
    const n = Object.assign(document.createElement(tag), props || {});
    kids.flat().forEach(k => k != null && k !== false && n.append(k instanceof Node ? k : String(k)));
    return n;
  }
  function toast(msg) {
    const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(t.h); t.h = setTimeout(() => t.style.display = 'none', 4000);
  }
  async function call(action, extra) {
    let j;
    try {
      const r = await fetch(EXEC, {method: 'POST', credentials: 'omit', body: JSON.stringify(Object.assign({action, session}, extra))});
      j = await r.json();
    } catch (e) { toast('تعذر الاتصال بالإنترنت أو بـ Google — أعد المحاولة'); throw e; }
    if (j.status === 'login') { remember(''); showLogin(); throw new Error('login'); }
    if (j.status === 'role') { toast('ليس لحسابك هذا الإذن'); throw new Error('role'); }
    if (j.user) setMe(j.user);
    // an Apps Script from before the accounts (not redeployed yet) names no user: its only sign-in is the admin's
    else if (!me && j.status === 'ok' && action !== 'login') setMe({login: 'admin', name: 'المسؤول', role: 'admin'});
    return j;
  }
  function setMe(u) {
    me = u;
    document.getElementById('who').textContent = u.name + ' · ' + (ROLE_NAME[u.role] || u.role);
    document.getElementById('users').hidden = !can('admin');
    document.getElementById('pw').hidden = u.login === 'admin';  // the admin's password is set in the app
    document.getElementById('out').hidden = false;
  }
  const fmtDate = s => { const d = new Date(s); return isNaN(d) || !s ? '' : d.toLocaleString('ar-MA', {dateStyle: 'medium', timeStyle: 'short'}); };
  const nav = (back) => { document.getElementById('back').hidden = !back; };
  const btn = (text, onclick, sec) => el('button', {className: 'act' + (sec ? ' sec' : ''), type: 'button', textContent: text, onclick});
  const field = (label, props) => { const i = el('input', props); return [el('label', null, label, i), i]; };
  const select = (opts, value) => el('select', null, ...opts.map(([v, t]) => el('option', {value: v, textContent: t, selected: String(v) === String(value)})));
  const loading = () => app.replaceChildren(el('p', {className: 'muted', textContent: 'جارٍ التحميل...'}));

  function pcLine(pc) {  // requests are carried out by the app on the computer: say whether it is there
    const age = Date.now() - pc;
    if (!pc) return el('div', {className: 'pc muted', textContent: 'لم تتصل المنصة على الحاسوب بهذه اللوحة بعد: الطلبات تنتظر فتحها.'});
    return el('div', {className: 'pc'}, age < 3 * 60e3
      ? el('span', {className: 'badge ok', textContent: '● الحاسوب متصل: الطلبات تُنفَّذ خلال دقيقة'})
      : el('span', {className: 'badge warn', textContent: '● الحاسوب غير متصل منذ ' + fmtDate(pc) + ': الطلبات تُنفَّذ عند فتح المنصة عليه'}));
  }

  function jobList(jobs) {
    if (!jobs || !jobs.length) return null;
    return el('div', null, ...jobs.map(j => el('div', {className: 'job'},
      el('b', {textContent: JOB[j.kind] || j.kind}),
      el('span', {className: 'badge ' + ({done: 'ok', error: 'err'}[j.status] || 'warn'),
        textContent: {'': 'ينتظر الحاسوب', running: 'قيد التنفيذ', done: 'تم', error: 'تعذّر'}[j.status] || j.status}),
      el('span', {className: 'muted', textContent: [j.by, fmtDate(j.at)].filter(Boolean).join(' · ')}),
      j.result ? el('div', {className: 'muted', style: 'flex-basis:100%', textContent: j.result}) : null, shareBar(j))));
  }

  function shareBar(j) {  // after one person's certificates: their links to paste in WhatsApp, and one file with all of them
    let s;
    try { s = JSON.parse(j.share || 'null'); } catch (e) { return null; }
    if (!s || !s.text) return null;
    const copy = btn('📋 نسخ النص والروابط', async () => {
      try { await navigator.clipboard.writeText(s.text); toast('نُسخ: الصقه في واتساب أو غيره'); } catch (e) { prompt('انسخ النص:', s.text); }
    }, true);
    return el('div', {className: 'bar', style: 'flex-basis:100%'}, copy,
      navigator.share ? btn('مشاركة', () => navigator.share({text: s.text}).catch(() => {}), true) : null,
      /^https:\/\//.test(s.pdf || '') ? el('a', {href: s.pdf, target: '_blank', rel: 'noopener', textContent: '⬇ ملف واحد بكل الشواهد'}) : null);
  }

  function linkBox(url, label) {  // copy, open or share a link from the phone
    const copy = btn('نسخ', async () => { try { await navigator.clipboard.writeText(url); toast('نُسخ الرابط'); } catch (e) { prompt('انسخ الرابط:', url); } }, true);
    const share = navigator.share ? btn('مشاركة', () => navigator.share({title: label, url}).catch(() => {}), true) : null;
    return el('div', {className: 'link'}, el('span', {className: 'ltr', textContent: url}), copy, share,
      el('a', {href: url, target: '_blank', rel: 'noopener', textContent: 'فتح'}));
  }

  function showLogin(msg) {
    me = null;
    ['out', 'back', 'users', 'pw'].forEach(id => { document.getElementById(id).hidden = true; });
    document.getElementById('who').textContent = '';
    const [lf, login] = field('اسم الدخول', {autocomplete: 'username', dir: 'ltr', placeholder: 'admin للمسؤول'});
    const [pf, pw] = field('كلمة السر', {type: 'password', autocomplete: 'current-password'});
    const err = el('p', {className: 'muted', textContent: msg || ''});
    const go = el('button', {className: 'act', textContent: 'دخول', style: 'width:100%;padding:11px'});
    const submit = async () => {
      go.disabled = true;
      try {
        const j = await call('login', {login: login.value, password: pw.value});
        if (j.status === 'ok') { remember(j.session); return route(); }
        err.textContent = {wrong: 'اسم الدخول أو كلمة السر غير صحيح', locked: 'محاولات خاطئة كثيرة: أعد المحاولة بعد 15 دقيقة',
                           nopassword: 'لم تُضبط كلمة سر المسؤول بعد (الإعدادات في المنصة على الحاسوب)'}[j.status] || 'تعذر الدخول';
      } catch (e) { /* toast shown */ } finally { go.disabled = false; }
    };
    go.onclick = submit; pw.onkeydown = e => { if (e.key === 'Enter') submit(); };
    app.replaceChildren(el('div', {className: 'card', id: 'login'}, el('h1', {textContent: 'دخول المنظمين'}),
      el('p', {className: 'muted', style: 'margin:0', textContent: 'الأنشطة والمشاركون والحضور والشواهد، من أي هاتف أو حاسوب.'}), lf, pf, go, err));
    login.focus();
  }

  // ---------- activities ----------

  async function showList() {
    nav(false); loading();
    const j = await call('activities');
    const acts = j.activities.sort((x, y) => Number(y.id) - Number(x.id));
    const sum = k => acts.reduce((n, a) => n + (Number(a[k]) || 0), 0);
    const cards = acts.map(a => el('a', {className: 'card', href: '#a' + a.id},
      el('div', {className: 'bar'}, el('span', {className: 'badge', textContent: a.kind || 'نشاط'}), el('span', {className: 'muted', textContent: a.org})),
      el('h2', {textContent: a.title}),
      el('div', {className: 'muted', textContent: (a.dates || '') + (a.sessions > 1 ? ` · ${a.sessions} حصص، المسح الآن للحصة ${a.session}` : '')}),
      el('div', {className: 'nums'}, ...[['مسجل', a.registered], ['حاضر', a.present], ['شهادة', a.issued], ['بريد', a.emailed]]
        .map(([k, v]) => el('div', null, el('b', {textContent: v || 0}), k)))));
    const top = [el('h1', {textContent: 'الأنشطة'})];
    if (can('organizer')) {
      top.push(pcLine(j.pc));
      const box = el('div');
      const add = btn('+ نشاط جديد', () => box.replaceChildren(activityForm(j.choices, null, () => showList())));
      const many = btn('+ شواهد لشخص', () => box.replaceChildren(bundleForm(j.choices, acts, () => showList())), true);
      top.push(el('div', {className: 'card'}, el('div', {className: 'bar'}, el('h2', {style: 'flex:1;margin:0', textContent: 'طلبات للحاسوب'}), add, many), box,
        jobList(j.jobs) || el('p', {className: 'muted', style: 'margin:4px 0 0', textContent: 'أنشئ نشاطاً من هنا: تُنشأ استمارته وجدوله على الحاسوب، ثم يظهر في هذه اللائحة.'})));
    }
    top.push(el('div', {className: 'card'}, el('h2', {textContent: 'الإجمالي'}),
      el('div', {className: 'nums five'}, ...[['نشاط', acts.length], ['مسجل', sum('registered')], ['حاضر', sum('present')], ['شهادة', sum('issued')], ['بريد', sum('emailed')]]
        .map(([k, v]) => el('div', null, el('b', {textContent: v}), k)))));
    app.replaceChildren(...top,
      ...(cards.length ? cards : [el('p', {className: 'muted', textContent: 'لا أنشطة منشورة بعد: زامن نشاطاً في المنصة على الحاسوب، أو أنشئ واحداً من هنا.'})]),
      can('organizer') ? pcOnly() : null);
  }

  function pcOnly() {  // what stays on the computer: heavy work, or files to print
    return el('div', {className: 'card'}, el('h2', {textContent: 'على الحاسوب (يُفضَّل استخدام الحاسوب)'}),
      el('ul', {className: 'pconly'}, ...['تصميم الشهادات ومعاينتها', 'أسئلة الاستمارة الإضافية', 'الاستيراد من Excel',
        'اللوائح والتقارير وملفات الطباعة (PDF وExcel)', 'إلغاء شهادة أو إرجاعها', 'الجهات المنظمة والأنواع والإعدادات',
        'سلة المحذوفات والنسخ الاحتياطية'].map(t => el('li', {textContent: t}))),
      el('p', {className: 'muted', style: 'margin:6px 0 0', textContent: 'إصدار الشواهد وإرسالها يُطلب من هنا، ويُنفَّذ على الحاسوب.'}));
  }

  // new activity (a null) or its details: a request the app carries out like its own form
  function activityForm(ch, a, close) {
    if (!ch) return el('div', {className: 'note', textContent: 'لم تنشر المنصة على الحاسوب قوائمها بعد (الجهات والأنواع): افتحها مرة واحدة وهي متصلة بالإنترنت.'});
    const inputs = {}, v = a || {sessions: 1, tickets: ch.tickets, lang: ch.lang};
    const f = (k, label, props) => { const [l, i] = field(label, Object.assign({value: v[k] == null ? '' : v[k]}, props)); inputs[k] = i; return l; };
    const s = (k, label, opts) => { inputs[k] = select(opts, v[k] == null ? opts[0][0] : v[k]); return el('label', null, label, inputs[k]); };
    const kinds = ch.kinds.map(k => [k, k]);
    if (a && a.kind && !ch.kinds.includes(a.kind)) kinds.unshift([a.kind, a.kind]);
    const err = el('p', {className: 'muted', style: 'color:var(--err)'});
    const save = el('button', {className: 'act', type: 'submit', textContent: a ? 'طلب التعديل' : 'طلب إنشاء النشاط'});
    const form = el('form', {className: 'card person'}, el('h2', {textContent: a ? 'تعديل النشاط' : 'نشاط جديد'}),
      f('title', 'العنوان', {required: true, maxLength: 200}),
      el('div', {className: 'grid2'}, s('kind', 'نوع النشاط', kinds),
        a ? null : s('org_id', 'الجهة المنظمة', ch.orgs.map(o => [o.id, o.name]))),
      a ? null : el('div', {className: 'grid2'}, s('lang', 'لغة النشاط والوثائق', [['ar', 'العربية'], ['fr', 'الفرنسية'], ['en', 'الإنجليزية']]),
        s('cert_type', 'نوع الشهادة الرئيسي', ch.types.map(t => [t, t]))),
      el('div', {className: 'grid2'}, f('dates', 'التاريخ / الأيام', {placeholder: 'مثال: 12 و13 مارس 2026'}), f('hours', 'التوقيت أو عدد الساعات')),
      f('place', 'المكان'),
      el('div', {className: 'grid2'}, f('sessions', 'عدد الحصص', {type: 'number', min: 1, max: 60}),
        f('min_sessions', 'الحد الأدنى للحضور (حصص)', {type: 'number', min: 1, max: 60, placeholder: 'كل الحصص'})),
      el('div', {className: 'grid2'}, f('tickets', 'عدد البطاقات المطبوعة', {type: 'number', min: 0, max: 2000}),
        f('whatsapp', 'رابط مجموعة واتساب', {dir: 'ltr', type: 'url'})),
      a || !ch.templates.length ? null : s('template', 'أسئلة إضافية من نموذج', [['', 'بلا أسئلة إضافية'], ...ch.templates.map(t => [t.id, t.name])]),
      el('p', {className: 'muted', textContent: a ? 'ما يُترك فارغاً يبقى كما هو. العنوان والتاريخ والمكان تتبعها الاستمارة في Google Forms.'
        : 'تُنشأ على الحاسوب الاستمارة وجدول التسجيلات، ثم يظهر النشاط هنا برابط استمارته. التصميم يُضاف على الحاسوب.'}),
      el('div', {className: 'bar'}, save, btn('إلغاء', close, true)), err);
    form.onsubmit = async e => {
      e.preventDefault();
      const data = {};
      Object.entries(inputs).forEach(([k, x]) => { const t = x.value.trim(); if (t !== '' && (!a || t !== String(v[k] == null ? '' : v[k]))) data[k] = t; });
      if (a && !Object.keys(data).length) return close();
      save.disabled = true;
      try {
        const r = await call('request', a ? {id: a.id, kind: 'update', data} : {kind: 'activity', data});
        if (r.status === 'ok') { toast('أُرسل الطلب، ويُنفَّذ على الحاسوب'); return close(); }
        err.textContent = {notitle: 'اكتب العنوان', exists: 'تعديل سابق ما زال ينتظر الحاسوب'}[r.status] || 'تعذر إرسال الطلب';
      } catch (x) { /* toast shown */ }
      save.disabled = false;
    };
    return form;
  }

  // one person (an organizer, a speaker...) given certificates in several past activities at once, then one message
  function bundleForm(ch, acts, close) {
    if (!ch) return activityForm(ch);
    const inputs = {}, picked = new Set(), answers = {};
    const fld = (k, label, props) => { const [l, i] = field(label, props); inputs[k] = i; return l; };
    inputs.gender = select([['m', 'ذكر'], ['f', 'أنثى'], ['', '—']], 'm');
    inputs.type = select(ch.types.map(t => [t, t]), ch.types[0]);
    // what each activity's design prints for a type (published by the app); an app of 1.8.0 only names the types
    const needs = (id, t) => ch.needs ? (ch.needs[id] || {})[t]
      : !ch.designs || (ch.designs[id] || []).includes(t) ? {names: [], mention: false, qs: []} : null;
    const list = el('div'), asked = el('div', {className: 'grid2'}), note = el('p', {className: 'muted'});
    const labels = {};
    let want = new Set(), qs = new Map();  // what the ticked designs print
    const draw = () => {
      want = new Set(); qs = new Map();
      list.replaceChildren(...acts.map(a => {
        const n = needs(a.id, inputs.type.value);
        if (!n) picked.delete(a.id);

      el('div', {className: 'grid2'}, star('first_ar', fld('first_ar', 'الاسم الشخصي بالعربية')), fld('last_ar', 'الاسم العائلي بالعربية'),
        star('first_lat', fld('first_lat', 'Prénom', {dir: 'ltr'})), fld('last_lat', 'Nom', {dir: 'ltr'})),
      el('div', {className: 'grid2'}, el('label', null, 'الجنس', inputs.gender), el('label', null, 'نوع الشهادة', inputs.type)),
      el('div', {className: 'grid2'}, fld('email', 'البريد (تصله عليه الرسالة)', {type: 'email', dir: 'ltr'}), fld('phone', 'الهاتف', {type: 'tel', dir: 'ltr'})),
      star('mention', fld('mention', 'الميزة/النتيجة')), asked, note,
      el('h2', {style: 'margin:12px 0 0', textContent: 'الأنشطة'}), list,
      el('div', {className: 'bar', style: 'margin-top:10px'}, save, btn('إلغاء', close, true)), err);
    inputs.type.onchange = draw; draw();
    form.onsubmit = async e => {

      asked.querySelectorAll('[data-q]').forEach(i => { if (i.value.trim()) data.answers[i.dataset.q] = i.value.trim(); });
      if (!data.acts.length) { err.textContent = 'اختر نشاطاً واحداً على الأقل'; return; }
      const has = (...ks) => ks.some(k => data[k]);
      const lack = [want.has('ar') && !has('first_ar', 'last_ar') && 'الاسم بالعربية', want.has('lat') && !has('first_lat', 'last_lat') && 'الاسم باللاتينية',

      const shown = people.filter(p => keep(p) && (!s || [p.name, p.name_ar, p.name_lat, p.ticket, p.serial, p.email, p.phone].join(' ').toLowerCase().includes(s)));

  const sessionsOf = p => [...new Set(String(p.attended || '').split(',').filter(Boolean).map(Number).concat(p.phone_scans))].sort();

    const card = el('div', {className: 'card person'});
    const att = sessionsOf(p);
    card.append(el('div', {className: 'top'}, el('b', {textContent: p.name || p.name_ar || p.name_lat}),

    const tags = el('div', {className: 'bar'});
    if (p.pending) tags.append(el('span', {className: 'badge warn', textContent: 'تعديل ينتظر المزامنة'}));
    tags.append(here(p) ? el('span', {className: 'badge ok', textContent: a.sessions > 1 ? `حاضر في الحصة ${a.session}` : 'حاضر'})
                        : el('span', {className: 'badge', textContent: 'غير مؤكد'}));
    if (a.sessions > 1 && att.length) tags.append(el('span', {className: 'muted', textContent: 'الحصص: ' + att.join('، ')}));
    if (p.type) tags.append(el('span', {className: 'badge', textContent: 'شهادة ' + p.type}));
    card.append(tags);
    if (p.serial) {

        p.revoked ? el('span', {className: 'badge err', textContent: 'ملغاة'}) : [

          /^https:\/\//.test(p.link) ? el('a', {href: p.link, target: '_blank', rel: 'noopener', textContent: 'تحميل'}) : null]));
    }
    const contact = [p.email, p.phone].filter(Boolean).join(' · ');
    if (contact) card.append(el('div', {className: 'muted ltr', style: 'text-align:right', textContent: contact}));
    if (p.mail) card.append(el('div', null, el('span', {className: 'badge ' + ({sent: 'ok', error: 'err', pending: 'warn'}[p.mail.status] || ''),
      textContent: {sent: '✉ أُرسل البريد', error: '✉ تعذر الإرسال', pending: '✉ في الطابور', cancelled: '✉ أُوقف'}[p.mail.status] || p.mail.status}),

        if (r.status === 'ok') { p.phone_scans.push(r.session); toast('سُجّل الحضور، ويصل إلى المنصة عند المزامنة'); card.replaceWith(personCard(a, p, here)); }
        else b.disabled = false;
      });

          if (!confirm('إعادة إرسال رسالة الشهادة نفسها إلى ' + p.email + '؟')) return;
          b.disabled = true;
          const r = await call('resend', {id: a.id, pid: p.pid}).catch(() => ({}));
          toast(r.status === 'ok' ? 'وُضعت الرسالة في طابور الإرسال' : 'نص الرسالة لم يعد محفوظاً (أقدم من 30 يوماً): أعد الإرسال من المنصة');
        }, true);

          el('span', {className: 'badge ' + (u.active ? 'ok' : 'err'), textContent: u.active ? 'مفعّل' : 'موقوف'})),
        r, mine ? el('p', {className: 'muted', style: 'margin:0', textContent: 'حسابك: يعدّله مسؤول آخر.'}) : el('div', {className: 'bar'},
          btn(u.active ? 'إيقاف الحساب' : 'تفعيل الحساب', () => set(u, {active: !u.active}, u.active ? 'أُوقف الحساب، ويخرج من اللوحة فوراً' : 'فُعّل الحساب'), true),
          btn('كلمة سر جديدة', () => { const p = prompt('كلمة السر الجديدة لـ ' + u.name + ' (8 أحرف على الأقل):'); if (p) set(u, {password: p}, 'تغيّرت كلمة السر'); }, true)));
    });
    app.replaceChildren(el('h1', {textContent: 'الحسابات'}),
      el('p', {className: 'muted', textContent: 'حساب المسؤول admin تُضبط كلمة سره في المنصة على الحاسوب، ويبقى دائماً طريقاً للدخول.'}),
      add, ...cards);
  }

  function showPassword() {
    nav(true);
    const [of, old] = field('كلمة السر الحالية', {type: 'password', autocomplete: 'current-password', required: true});
    const [nf, pw] = field('كلمة السر الجديدة (8 أحرف على الأقل)', {type: 'password', autocomplete: 'new-password', required: true, minLength: 8});
    const err = el('p', {className: 'muted', style: 'color:var(--err)'});
    const form = el('form', {className: 'card person', style: 'max-width:420px'}, el('h2', {textContent: 'تغيير كلمة السر'}), of, nf,
      el('div', {className: 'bar'}, el('button', {className: 'act', type: 'submit', textContent: 'حفظ'})), err);
    form.onsubmit = async e => {
      e.preventDefault();
      const r = await call('password', {old: old.value, password: pw.value}).catch(() => ({}));
      if (r.status === 'ok') { toast('تغيّرت كلمة السر'); location.hash = ''; return; }
      err.textContent = {wrong: 'كلمة السر الحالية غير صحيحة', short: 'كلمة السر الجديدة قصيرة', owner: 'كلمة سر المسؤول تُغيَّر في المنصة على الحاسوب'}[r.status] || 'تعذر الحفظ';
    };
    app.replaceChildren(form);
  }

  function route() {
    if (!session) return showLogin();
    const m = location.hash.match(/^#a(\d+)$/);
    (m ? showActivity(m[1]) : location.hash === '#users' ? showUsers() : location.hash === '#pw' ? Promise.resolve(showPassword()) : showList()).catch(() => {});
  }
  document.getElementById('back').onclick = () => { location.hash = ''; };
  document.getElementById('users').onclick = () => { location.hash = '#users'; };
  document.getElementById('pw').onclick = () => { location.hash = '#pw'; };
  document.getElementById('out').onclick = async () => { try { await call('logout'); } catch (e) {} remember(''); location.hash = ''; showLogin(); };
  addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
