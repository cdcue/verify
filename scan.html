<style>
  /* the scanning page: a compact bar, the counts, the camera as large as the screen allows, then what was scanned */
  .top { padding-bottom: 14px; }
  .top .bar { padding-bottom: 6px; }
  .top h1 { margin: 0; font-size: 20px; }
  .top .what { opacity: .85; font-size: 14px; margin-top: 2px; }
  .app main { margin: 0 auto; max-width: 620px; padding: 14px 16px calc(28px + env(safe-area-inset-bottom)); display: grid; gap: 12px; align-content: start; }
  .netline { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; padding: 8px 12px; border-radius: 12px; }
  .netline.on { background: var(--ok-soft); color: var(--ok); }
  .netline.off { background: var(--warn-soft); color: var(--warn); }
  .netline i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .counts div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; font-size: 12.5px; color: var(--muted); }
  .counts b { display: block; font-size: 28px; line-height: 1.15; color: var(--gold); }
  .btn.big { min-height: 58px; font-size: 17px; width: 100%; }
  /* the box takes the camera's own shape: the whole view, nothing cut or zoomed; the square is exactly what is read */
  #cam { position: relative; border-radius: 18px; overflow: hidden; background: #000; margin: 0 auto;
         aspect-ratio: var(--ar, 3 / 4); width: min(100%, calc(50vh * var(--arn, .75))); }
  #cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #cam .frame { position: absolute; inset-inline: calc((100% - var(--fw, 60%)) / 2); inset-block: calc((100% - var(--fh, 45%)) / 2);
                border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .35); }
  #cam .frame::before, #cam .frame::after { content: ""; position: absolute; inset: 0; border-radius: 18px; border: 3px solid rgba(255, 255, 255, .85);
    -webkit-mask: linear-gradient(#000 0 0) top / 34% 100% no-repeat, linear-gradient(#000 0 0) bottom / 34% 100% no-repeat; }
  #cam .frame::after { -webkit-mask: linear-gradient(#000 0 0) left / 100% 34% no-repeat, linear-gradient(#000 0 0) right / 100% 34% no-repeat; }
  #cam .line { position: absolute; inset-inline: 6%; height: 2px; top: 6%; background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: sweep 2.2s ease-in-out infinite alternate; }
  @keyframes sweep { to { top: 94%; } }
  #cam .over { position: absolute; top: 10px; inset-inline-end: 10px; display: flex; gap: 8px; }
  #cam .over .iconbtn { background: rgba(0, 0, 0, .45); border-color: rgba(255, 255, 255, .3); }
  #cam .over .iconbtn[aria-pressed="true"] { background: var(--gold); color: #0b1f3a; }
  #cam .over .iconbtn { width: 46px; height: 46px; }  /* fingers in a hurry, in a hall */
  #cam .hit { position: absolute; inset-inline: 10px; bottom: 10px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px;
              color: #fff; font-size: 16px; font-weight: 600; background: rgba(0, 0, 0, .62); animation: pop .15s ease-out; }
  #cam .hit b { direction: ltr; font-variant-numeric: tabular-nums; }
  #cam .hit span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cam .hit.ok { background: rgba(18, 163, 138, .92); }
  #cam .hit.warn { background: rgba(201, 138, 12, .92); }
  .manual { display: flex; gap: 8px; align-items: center; }
  .manual input { flex: 1; direction: ltr; text-align: center; letter-spacing: 1px; }
  .manual .btn { min-height: 52px; }
  #log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  #log li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; animation: rise .2s ease-out; }
  #log .s { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; flex: none; }
  #log .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #log .t { direction: ltr; color: var(--muted); font-size: 13px; }
  #flash { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 24px;
           font-size: 23px; font-weight: 700; color: #fff; z-index: 20; }
  #flash.on { display: flex; animation: pop .18s ease-out; }
  #flash .icon { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; font-size: 72px; line-height: 1; margin-bottom: 18px;
                 background: rgba(255, 255, 255, .18); }
  #flash .sub { display: block; font-size: 17px; font-weight: 500; opacity: .92; margin-top: 6px; }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } }
  .denied { margin: 0; padding: 12px 14px; border-radius: 12px; line-height: 1.8; background: var(--warn-soft); color: var(--ink); }
  .codebox { max-width: 460px; margin: 0 auto; width: 100%; }
</style>
</head>
<body class="app">
<header class="top">
  <div class="bar" id="bar"></div>
  <div class="hero" style="margin-top:4px">
    <h1 data-t="title"></h1>
    <div class="what" id="what" dir="auto" data-t="loading"></div>
  </div>
</header>
<main>
  <form id="codeBox" class="card pad stack codebox" hidden novalidate>
    <p id="denied" class="denied" hidden data-t="denied"></p>
    <div><h2 data-t="codeT"></h2><p class="hint" style="margin-top:6px" data-t="codeD"></p></div>
    <div><label for="code" data-t="codeL"></label>
      <input id="code" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="11" placeholder="XXXX-XXXX" class="code"></div>
    <button class="btn block" data-t="codeGo"></button>
    <p class="say" id="codeSay" role="alert"></p>
  </form>
  <div id="main" style="display:grid;gap:12px;align-content:start">
    <div class="netline on" id="net"><i></i><span></span></div>
    <div class="counts"><div><b id="present">–</b><span data-t="present"></span></div><div><b id="total">–</b><span data-t="total"></span></div>
      <div><b id="mine">0</b><span data-t="mine"></span></div></div>
    <button class="btn big" id="start" type="button" data-t="start"></button>
    <div id="cam" hidden><video playsinline muted></video><div class="frame"><i class="line"></i></div>
      <div class="over">
        <button type="button" class="iconbtn" id="stop"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <button type="button" class="iconbtn" id="flip" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 00-14.3-4.9L4 8"/><path d="M4 3v5h5"/><path d="M4 13a8 8 0 0014.3 4.9L20 16"/><path d="M20 21v-5h-5"/></svg></button>
        <button type="button" class="iconbtn" id="torch" hidden aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l-2 6h-4z"/><path d="M10 8h4v12a2 2 0 01-4 0z"/></svg></button></div>
      <div class="hit" id="hit" hidden><b></b><span dir="auto"></span></div></div>
    <form class="manual" id="manualForm"><input id="manual" inputmode="numeric" autocomplete="off" data-tp="manualPh"><button class="btn ghost" data-t="confirm"></button></form>
    <ul id="log" aria-live="polite"></ul>
  </div>
</main>
<div id="flash" role="alert"><div class="icon"></div><div class="msg"></div></div>

<script>
// the Apps Script web app (same /exec address as the verification page); the activity's secret is after "#"
const EXEC = 'https://script.google.com/macros/s/AKfycbyhQdedASgHUcB7vIZ6mAtgzy1fo6TFTa0bGybYmjnnU5JV79VRCzwudv8wMSJnL71i/exec';
let TOKEN = decodeURIComponent(location.hash.slice(1)) || UI.store.get('shawahid-scan') || '';
let KEY = 'shawahid-pending-' + TOKEN.slice(0, 8);  // scans kept on this phone while the network is down
const T = {
  ar: {title: 'مسح الحضور', loading: 'جارٍ التحميل...', denied: 'هذا الرابط غير صالح أو استُبدل برابط جديد. اطلب من المنظم الرابط الحالي، أو اكتب رمز المسح.',
       codeT: 'الدخول برمز المسح', codeD: 'اكتب الرمز الذي أعطاك إياه المنظم (8 حروف وأرقام)، أو افتح رابط المسح مباشرة.', codeL: 'رمز المسح', codeGo: 'دخول',
       codeWrong: 'الرمز غير صحيح، أو تغيّر مع رابط جديد، أو انتهى النشاط.', codeBusy: 'محاولات كثيرة: أعد المحاولة بعد 10 دقائق.', codeNet: 'تعذر الاتصال: تأكد من الإنترنت ثم أعد المحاولة.',
       present: 'حضور مؤكد', total: 'مسجل', mine: 'مسحتَ الآن', start: 'تشغيل الكاميرا وبدء المسح', manualPh: 'أو اكتب رقم البطاقة: 12', confirm: 'تأكيد',
       online: 'متصل بالإنترنت', offline: 'دون إنترنت: المسح يُحفظ في الهاتف ويُرسل عند عودة الاتصال',
       pending: n => `${n} بطاقة محفوظة في الهاتف بانتظار الاتصال`, session: (s, n) => `الحصة ${s} من ${n}`, noNet: 'لا اتصال بالإنترنت الآن — المسح يُحفظ في الهاتف',
       noCam: 'تعذر تشغيل الكاميرا. اسمح للمتصفح باستعمالها، أو اكتب أرقام البطاقات.', torch: 'الإضاءة',
       stop: 'إيقاف الكاميرا', flip: 'تبديل الكاميرا', checking: 'جارٍ التأكيد…',
       ok: 'تم تأكيد حضور', already: 'مؤكد سابقاً في هذه الحصة', unregistered: x => `البطاقة ${x} غير مسجلة في الاستمارة`,
       unregisteredSub: 'احتُفظ بها، وتُؤكَّد عند تسجيل صاحبها', duplicate: x => `البطاقة ${x} مسجلة باسمين`, duplicateSub: 'يُحسم الأمر من لوحة التحكم',
       invalid: x => `الرقم ${x} غير موجود ضمن البطاقات المطبوعة`, saved: x => `حُفظت البطاقة ${x} في الهاتف`, savedSub: 'تُرسل تلقائياً عند عودة الاتصال'},
  fr: {title: 'Scan des présences', loading: 'Chargement...', denied: 'Ce lien n’est pas valide ou a été remplacé. Demandez le lien actuel à l’organisateur, ou saisissez le code de scan.',
       codeT: 'Accès par code de scan', codeD: 'Saisissez le code donné par l’organisateur (8 lettres et chiffres), ou ouvrez directement le lien de scan.', codeL: 'Code de scan', codeGo: 'Entrer',
       codeWrong: 'Code incorrect, remplacé par un nouveau lien, ou activité terminée.', codeBusy: 'Trop d’essais : réessayez dans 10 minutes.', codeNet: 'Connexion impossible : vérifiez Internet puis réessayez.',
       present: 'présences confirmées', total: 'inscrits', mine: 'scannés ici', start: 'Activer la caméra et scanner', manualPh: 'ou saisissez le n° de carte : 12', confirm: 'Valider',
       online: 'Connecté à Internet', offline: 'Hors ligne : les scans sont gardés sur le téléphone et envoyés au retour de la connexion',
       pending: n => `${n} carte(s) gardée(s) sur le téléphone en attente de connexion`, session: (s, n) => `séance ${s} sur ${n}`,
       noNet: 'Pas de connexion pour l’instant — les scans sont gardés sur le téléphone',
       noCam: 'Impossible d’activer la caméra. Autorisez-la dans le navigateur, ou saisissez les numéros de carte.', torch: 'Lampe',
       stop: 'Arrêter la caméra', flip: 'Changer de caméra', checking: 'Vérification…',
       ok: 'Présence confirmée', already: 'Déjà confirmé pour cette séance', unregistered: x => `La carte ${x} n’est pas inscrite au formulaire`,
       unregisteredSub: 'Elle est gardée et sera confirmée à l’inscription de son titulaire', duplicate: x => `La carte ${x} est inscrite sous deux noms`,
       duplicateSub: 'À régler depuis l’espace organisateurs', invalid: x => `Le numéro ${x} ne fait pas partie des cartes imprimées`,
       saved: x => `Carte ${x} gardée sur le téléphone`, savedSub: 'Envoyée automatiquement au retour de la connexion'},
  en: {title: 'Attendance scan', loading: 'Loading...', denied: 'This link is not valid or was replaced by a new one. Ask the organizer for the current link, or type the scanning code.',
       codeT: 'Sign in with the scanning code', codeD: 'Type the code the organizer gave you (8 letters and digits), or open the scanning link directly.', codeL: 'Scanning code', codeGo: 'Enter',
       codeWrong: 'Wrong code, replaced with a new link, or the activity has ended.', codeBusy: 'Too many tries: try again in 10 minutes.', codeNet: 'Could not connect: check the Internet and try again.',
       present: 'confirmed', total: 'registered', mine: 'scanned here', start: 'Start the camera and scan', manualPh: 'or type the ticket number: 12', confirm: 'Confirm',
       online: 'Online', offline: 'Offline: scans are kept on the phone and sent when the connection is back',
       pending: n => `${n} ticket(s) kept on the phone, waiting for the connection`, session: (s, n) => `session ${s} of ${n}`,
       noNet: 'No connection right now — scans are kept on the phone',
       noCam: 'Could not start the camera. Allow it in the browser, or type the ticket numbers.', torch: 'Light',
       stop: 'Stop the camera', flip: 'Switch camera', checking: 'Checking…',
       ok: 'Attendance confirmed', already: 'Already confirmed for this session', unregistered: x => `Ticket ${x} is not registered in the form`,
       unregisteredSub: 'Kept, and confirmed once its holder registers', duplicate: x => `Ticket ${x} is registered under two names`,
       duplicateSub: 'To be settled from the organizers’ dashboard', invalid: x => `Number ${x} is not among the printed tickets`,
       saved: x => `Ticket ${x} kept on the phone`, savedSub: 'Sent automatically when the connection is back'},
};
const {t} = UI, $ = id => document.getElementById(id);
const video = document.querySelector('video'), flash = $('flash'), canvas = document.createElement('canvas');
let audio = null, mine = 0, about = null, stream = null, running = false, det, facing = 'environment', ctx = null;
const seen = new Map();  // ticket -> when the camera last saw it: it sees the same ticket many times a second
const LOOK = {  // icon, color, main line, second line
  ok: ['✓', '#12a38a', j => [t('ok'), j.name]],
  already: ['✓', '#2e6be6', j => [t('already'), j.name]],
  unregistered: ['!', '#c98a0c', j => [t('unregistered')(j.ticket), t('unregisteredSub')]],
  duplicate: ['!', '#c98a0c', j => [t('duplicate')(j.ticket), t('duplicateSub')]],
  invalid: ['✕', '#e5484d', j => [t('invalid')(j.ticket), '']],
  saved: ['⏳', '#7a560f', j => [t('saved')(j.ticket), t('savedSub')]],
};

const pending = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
const setPending = p => { try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) { /* not kept */ } showNet(); };
function showNet() {
  const n = pending().length, on = navigator.onLine;
  $('net').className = 'netline ' + (on && !n ? 'on' : 'off');
  $('net').querySelector('span').textContent = n ? t('pending')(n) : t(on ? 'online' : 'offline');
}
addEventListener('online', () => { showNet(); retry(); });
addEventListener('offline', showNet);

async function call(body) {  // text/plain keeps the request simple: no preflight, no Google account needed
  const r = await fetch(EXEC, {method: 'POST', body: JSON.stringify(Object.assign({token: TOKEN}, body)), credentials: 'omit'});
  return r.json();
}
function beep(ok) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = ok ? 880 : 300; g.gain.value = 0.15;
  o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (ok ? 0.12 : 0.35));
}
function counts(j) {
  if (j.present !== undefined) { $('present').textContent = j.present; $('total').textContent = j.total; }
}
function show(j) {  // a problem: the whole screen, so the organizer stops this person
  const [icon, color, text] = LOOK[j.status], [line1, line2] = text(j);
  flash.style.background = color;
  flash.querySelector('.icon').textContent = icon;
  // names come from the public form: text only, never HTML
  flash.querySelector('.msg').replaceChildren(line1, line2 ? UI.el('span', {className: 'sub', dir: 'auto', textContent: line2}) : '');
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 2200);
}
let hitT = 0;
function strip(ticket, text, kind) {  // the line on the camera: what was just read, then its answer
  const h = $('hit');
  h.className = 'hit ' + (kind || '');
  h.querySelector('b').textContent = ticket;
  h.querySelector('span').textContent = text;
  h.hidden = false;
  clearTimeout(hitT);
  hitT = setTimeout(() => { h.hidden = true; }, kind ? 2500 : 8000);
}
function row(ticket) {  // a line in the list, filled when the answer comes
  const li = UI.el('li', {}, UI.el('span', {className: 's', style: 'background:#7a8899', textContent: '…'}),
    UI.el('span', {className: 'n', dir: 'auto', textContent: t('checking')}), UI.el('span', {className: 't', textContent: ticket}));
  $('log').prepend(li);
  return li;
}
function answer(j, li, ticket) {
  const [icon, color, text] = LOOK[j.status], [line1] = text(j), good = j.status === 'ok' || j.status === 'already';
  li.querySelector('.s').style.background = color;
  li.querySelector('.s').textContent = icon;
  li.querySelector('.n').textContent = j.name || line1;
  if ($('hit').querySelector('b').textContent === ticket) strip(ticket, j.name || line1, good ? 'ok' : 'warn');
  if (!good) { beep(false); if (navigator.vibrate) navigator.vibrate([80, 60, 80]); show(j); }
  if (j.status === 'ok') $('mine').textContent = ++mine;
  counts(j);
}
function scan(raw) {  // the read is confirmed at once and the camera goes on; the answer fills its line when it comes
  const s = String(raw).trim(), ticket = (s.toUpperCase().match(/T\d+-\d+/) || [s])[0];
  const before = seen.get(ticket) || 0;
  seen.set(ticket, Date.now());  // a ticket still in front of the camera stays ignored; 6 s away from it, it can be read again
  if (!s || Date.now() - before < 6000) return;
  beep(true);
  if (navigator.vibrate) navigator.vibrate(40);
  strip(ticket, t('checking'));
  const li = row(ticket);
  call({action: 'scan', ticket: s}).then(j => {
    if (j.status === 'denied') return denied();
    if (LOOK[j.status]) answer(j, li, ticket);
  }).catch(() => {
    setPending(pending().concat([s]));
    answer({status: 'saved', ticket}, li, ticket);
  });
}
async function retry() {  // scans kept during a network cut leave as soon as it is back, oldest first
  const p = pending();
  if (!p.length) return;
  try {
    const j = await call({action: 'scan', ticket: p[0]});
    setPending(pending().slice(1));
    counts(j);
  } catch (e) { /* still offline */ }
}
setInterval(retry, 8000);

function denied(fresh) {  // no link, or an old one: the code form (with a word on the old link)
  $('main').hidden = true; $('main').style.display = 'none'; $('codeBox').hidden = false; $('denied').hidden = !!fresh;
  if (!fresh) UI.store.set('shawahid-scan', null);
  about = null; $('what').removeAttribute('data-t'); $('what').textContent = '';
  $('code').focus();
}
$('codeBox').onsubmit = async e => {
  e.preventDefault();
  const go = $('codeBox').querySelector('button');
  if ($('code').value.replace(/[^a-z0-9]/gi, '').length !== 8) return $('code').focus();
  go.disabled = true;
  try {
    const j = await call({action: 'code', code: $('code').value, token: ''});
    if (j.status === 'ok') return start(j.token);
    $('codeSay').textContent = t(j.status === 'busy' ? 'codeBusy' : 'codeWrong');
  } catch (err) { $('codeSay').textContent = t('codeNet'); }
  go.disabled = false;
};
function start(token) {  // the page goes on with this link, kept on the phone for the next time it opens
  TOKEN = token; KEY = 'shawahid-pending-' + TOKEN.slice(0, 8);
  history.replaceState(null, '', '#' + encodeURIComponent(token));
  UI.store.set('shawahid-scan', token);
  $('codeBox').hidden = true; $('main').hidden = false; $('main').style.display = 'grid';
  info(); setInterval(info, 20000); showNet();
}
function describe() {
  if (about) $('what').removeAttribute('data-t');  // from now on its text is the activity's, not "loading"
  if (about === 'off') $('what').textContent = t('noNet');
  else if (about) $('what').textContent = [about.title, about.dates, about.sessions > 1 ? t('session')(about.session, about.sessions) : ''].filter(Boolean).join(' · ');
}
async function info() {
  try {
    const j = await call({action: 'info'});
    if (j.status === 'denied') return denied();
    about = j;
    counts(j);
  } catch (e) { about = 'off'; }
  describe();
}

async function detector() {  // the phone's own QR reader (most Android phones), else jsQR (iPhone)
  try {
    if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('qr_code')) return new BarcodeDetector({formats: ['qr_code']});
  } catch (e) { /* not on this phone */ }
  return null;
}
async function camOn() {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio: false,
      video: {facingMode: {ideal: facing}, width: {ideal: 1920}, height: {ideal: 1080}}});  // more pixels: the ticket's dense code stays sharp
  } catch (e) { return alert(t('noCam')); }
  video.srcObject = stream;
  await video.play();
  const w = video.videoWidth || 3, h = video.videoHeight || 4, side = 0.8 * Math.min(w, h), box = $('cam').style;
  box.setProperty('--ar', `${w} / ${h}`); box.setProperty('--arn', String(w / h));
  box.setProperty('--fw', side / w * 100 + '%'); box.setProperty('--fh', side / h * 100 + '%');  // the part read() looks at
  $('cam').hidden = false; $('start').hidden = true;
  const track = stream.getVideoTracks()[0], caps = (track.getCapabilities && track.getCapabilities()) || {};
  if ((caps.focusMode || []).includes('continuous')) track.applyConstraints({advanced: [{focusMode: 'continuous'}]}).catch(() => {});
  const b = $('torch');
  b.hidden = !caps.torch; b.setAttribute('aria-pressed', 'false');  // a dark hall: the phone's light (Android)
  b.onclick = () => { const on = b.getAttribute('aria-pressed') !== 'true'; track.applyConstraints({advanced: [{torch: on}]}).then(() => b.setAttribute('aria-pressed', String(on)), () => {}); };
  const cams = (await navigator.mediaDevices.enumerateDevices().catch(() => [])).filter(d => d.kind === 'videoinput');
  $('flip').hidden = cams.length < 2;
  if (det === undefined) det = await detector();
  running = true;
  loop();
}
function camOff() {
  running = false;
  if (stream) stream.getTracks().forEach(tr => tr.stop());
  stream = null; video.srcObject = null;
  $('cam').hidden = true; $('start').hidden = false;
}
function labels() {  // the camera buttons' names, in the page's language
  for (const [id, key] of [['stop', 'stop'], ['flip', 'flip'], ['torch', 'torch']]) { $(id).title = t(key); $(id).setAttribute('aria-label', t(key)); }
}
$('start').onclick = camOn;
$('stop').onclick = camOff;
$('flip').onclick = async () => { facing = facing === 'environment' ? 'user' : 'environment'; camOff(); await camOn(); };
document.addEventListener('visibilitychange', () => { if (document.hidden && running) camOff(); });  // in a pocket: no battery spent
async function read() {  // a ticket's QR code in the picture now, or null
  if (det) {
    try { return (await det.detect(video)).map(c => c.rawValue).find(v => /T\d+-\d+/i.test(v)) || null; }
    catch (e) { det = null; }  // this phone's reader failed: jsQR from now on
  }
  if (!window.jsQR) return null;
  // the middle of the picture at full size, not the whole picture made smaller: the code's squares stay readable
  const vw = video.videoWidth, vh = video.videoHeight, side = Math.round(Math.min(vw, vh) * 0.8), size = Math.min(side, 900);
  if (canvas.width !== size) { canvas.width = canvas.height = size; ctx = null; }
  ctx = ctx || canvas.getContext('2d', {willReadFrequently: true});
  ctx.drawImage(video, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, size, size);
  const code = jsQR(ctx.getImageData(0, 0, size, size).data, size, size, {inversionAttempts: 'dontInvert'});
  return code && /T\d+-\d+/i.test(code.data) ? code.data : null;
}
async function loop() {
  if (!running) return;
  if (video.readyState >= 2 && !flash.classList.contains('on')) {
    try { const hit = await read(); if (hit) scan(hit); } catch (e) { /* the next picture tries again */ }
  }
  setTimeout(loop, 120);
}
$('manualForm').onsubmit = e => {
  e.preventDefault();
  const v = $('manual').value.trim();
  if (!v) return;
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  seen.delete((v.toUpperCase().match(/T\d+-\d+/) || [v])[0]);  // typed on purpose: always sent
  scan(v);
  $('manual').value = '';
};

$('bar').append(UI.brand('index.html', 'title'), UI.el('div', {className: 'tools'}, UI.langSwitch(), UI.themeButton()));
UI.init({page: 'scan', name: 'title', shell: false, T, onLang: () => { describe(); showNet(); labels(); }});
labels();
if (TOKEN.length < 20) denied(true); else start(TOKEN);
</script>
