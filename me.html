async function call(action, extra) {

    const r = await fetch(EXEC, {method: 'POST', credentials: 'omit', body: JSON.stringify(Object.assign({action}, extra))});
    return await r.json();

}

function fold(id, title, sub, ico, ...body) {  // a card that opens and closes from its title line; this device remembers it
  const d = el('details', {className: 'card fold rise', id}), k = 'shawahid-fold-' + id;
  d.append(el('summary', {}, icon('ico', ICON[ico]), el('span', {className: 'ttl'}, el('b', {textContent: title}), el('small', {textContent: sub})),
    icon('chev', ICON.chev)), el('div', {className: 'body'}, ...body));

const said = (r, map) => t(map[r.status] || 'sendFail');

function signIn(msg) {
  view = () => signIn(msg);
  const [pb, ph] = idField(), [wb, pw] = password('password', 'current-password');
  const say = el('p', {className: 'say', role: 'alert', textContent: msg || ''});
  const go = el('button', {className: 'btn block', type: 'submit', textContent: t('signIn')});
  const f = form(pb, wb, go, say, el('div', {className: 'btns', style: 'justify-content:space-between'},
    el('button', {type: 'button', className: 'linkbtn', textContent: t('forgot'), onclick: () => forgot(ph.value)}),
    el('button', {type: 'button', className: 'linkbtn', textContent: t('noAcc'), onclick: () => openAccount()})));
  f.onsubmit = async e => {
    e.preventDefault();
    if (!ph.value.trim()) return ph.focus();
    if (!pw.value) return pw.focus();
    const done = busy(go);
    try {
      const r = await call('melogin', {id: ph.value, phone: ph.value, password: pw.value});
      if (r.status === 'ok') { keep(r.token); return mine(); }
      say.textContent = t(r.status === 'locked' ? 'locked' : 'wrongIn');
    } catch (e2) { /* toast shown */ }
    done();
  };
  show(switcher('tIn'), f);
  ph.focus();
}

function openAccount() {
  view = () => openAccount();
  const [pb, ph] = phoneField();
  const [eb, em] = emailField('email', 'emailHelp');
  const [nb, nm] = input('name', {type: 'text', dir: 'auto', autocomplete: 'name', required: true, maxLength: 80}, 'nameHelp');
  const say = el('p', {className: 'say', role: 'alert'});
  const go = el('button', {className: 'btn block', type: 'submit', textContent: t('sendCode')});
  const f = form(el('div', {}, el('h2', {textContent: t('newT')}), el('p', {className: 'hint', style: 'margin-top:6px', textContent: t('newD')})),
    pb, eb, nb, go, say);
  f.onsubmit = async e => {
    e.preventDefault();
    const done = busy(go);
    try {
      const r = await call('meopen', {phone: ph.value, email: em.value, name: nm.value});
      if (r.status === 'sent') return setPassword('meconfirm', ph.value, t('codeD'), 'activate');
      say.textContent = said(r, {badphone: 'badphone', bademail: 'bademail', badname: 'badname', taken: 'taken', emailtaken: 'emailtaken', wait: 'wait', busy: 'busy'});
      if (r.status === 'taken' || r.status === 'emailtaken') say.append(' ', el('button', {type: 'button', className: 'linkbtn', textContent: t('forgot'),
        onclick: () => forgot(r.status === 'taken' ? ph.value : em.value)}));
    } catch (e2) { /* toast shown */ }
    done();
  };
  show(switcher('tNew'), f);
  ph.focus();
}

function forgot(who) {
  view = () => forgot(who);
  const [pb, ph] = idField();
  ph.value = who || '';
  const say = el('p', {className: 'say', role: 'alert'});
  const go = el('button', {className: 'btn block', type: 'submit', textContent: t('sendCode')});
  const f = form(el('div', {}, el('h2', {textContent: t('forgotT')}), el('p', {className: 'hint', style: 'margin-top:6px', textContent: t('forgotD')})),
    pb, go, say, el('div', {className: 'btns', style: 'justify-content:space-between'},
      el('button', {type: 'button', className: 'linkbtn', textContent: t('back'), onclick: () => signIn()}),
      el('button', {type: 'button', className: 'linkbtn', textContent: t('lost'), onclick: () => recover()})));
  f.onsubmit = async e => {
    e.preventDefault();
    if (!ph.value.trim()) return ph.focus();
    const done = busy(go);
    try {
      const r = await call('meforgot', {id: ph.value, phone: ph.value});
      if (r.status === 'sent') return setPassword('mereset', ph.value, t('resetD'), 'save');
      say.textContent = t(r.status === 'wait' || r.status === 'busy' ? r.status : 'sendFail');
    } catch (e2) { /* toast shown */ }
    done();
  };

  ph.focus();
}

function recover() {  // email and password both lost: a request to the administrator, who checks who it is first
  view = () => recover();
  const [pb, ph] = phoneField('recPhone'), [eb, em] = emailField('newEmail');
  const [nb, nm] = input('name', {type: 'text', dir: 'auto', autocomplete: 'name', required: true, maxLength: 80});

function setPassword(action, phone, note, label) {  // the code received by email, and the password of one's choice
  view = () => setPassword(action, phone, note, label);
  const [cb, code] = input('code', {dir: 'ltr', inputMode: 'numeric', autocomplete: 'one-time-code', maxLength: 6, placeholder: '••••••', className: 'code'});
  const [p1b, p1] = password('newPw', 'new-password'), [p2b, p2] = password('newPw2', 'new-password');
  const say = el('p', {className: 'say', role: 'alert'});
  const go = el('button', {className: 'btn block', type: 'submit', textContent: t(label)});
  const f = form(el('div', {}, el('h2', {textContent: t('codeT')}), el('p', {className: 'hint', style: 'margin-top:6px', textContent: note})),
    cb, p1b, p2b, go, say, el('div', {}, el('button', {type: 'button', className: 'linkbtn', textContent: t('back'), onclick: () => signIn()})));
  f.onsubmit = async e => {
    e.preventDefault();
    if (code.value.replace(/\D/g, '').length !== 6) return code.focus();
    if (p1.value.length < 8) { say.textContent = t('short'); return p1.focus(); }
    if (p1.value !== p2.value) { say.textContent = t('mismatch'); return p2.focus(); }
    const done = busy(go);
    try {
      const r = await call(action, {id: phone, phone, code: code.value, password: p1.value});
      if (r.status === 'ok') { keep(r.token); return mine(); }
      say.textContent = t({wrong: 'wrong', short: 'short', taken: 'taken'}[r.status] || 'expired');
    } catch (e2) { /* toast shown */ }
    done();
  };
  show(f);
  code.focus();
}

let data = null;  // the signed-in person's answer, kept to redraw it in another language without asking again
async function mine() {
  view = () => data ? draw(data) : mine();
  show(el('div', {className: 'card', ariaBusy: 'true'}, el('div', {className: 'skeleton'},
    el('i', {style: 'width:35%'}), el('i', {style: 'width:70%'}), el('span', {className: 'hint', textContent: t('loading')}))));
  let j;
  try { j = await call('me', {token}); } catch (e) { return; }
  if (j.status !== 'ok') { keep(''); return signIn(t('ended')); }
  data = j;
  draw(j);
}
const signOut = () => { keep(''); data = null; signIn(); };

function addBox() {  // a certificate added by its number, when the name on it is the account's
  const [sb, serial] = input('serial', {dir: 'ltr', autocomplete: 'off', spellcheck: false, placeholder: t('addPh'), style: 'text-transform:uppercase'});
  const [cb, vcode] = input('vcodeL', {dir: 'ltr', autocomplete: 'off', spellcheck: false, maxLength: 8, style: 'text-transform:uppercase'});
  const say = el('p', {className: 'say', role: 'alert'});
  const go = el('button', {className: 'btn', type: 'submit', textContent: t('add')});
  const f = el('form', {className: 'stack', noValidate: true}, el('p', {className: 'hint', textContent: t('addD')}), sb, cb, go, say);
  f.onsubmit = async e => {
    e.preventDefault();
    if (!serial.value.trim()) return serial.focus();
    const done = busy(go);
    try {
      const r = await call('meclaim', {token, serial: serial.value, code: vcode.value});
      if (r.status === 'ok') { UI.toast(t('added')); data = null; return mine(); }
      if (r.status === 'login') return signOut();
      say.textContent = t({notfound: 'notfound', have: 'have', revoked: 'revokedC', name: 'nameC', wait: 'waitC', code: 'codeC'}[r.status] || 'sendFail');
      if (r.status === 'code') vcode.focus();
    } catch (e2) { /* toast shown */ }
    done();
  };
  return fold('addBox', t('addT'), t('addS'), 'plus', f);
}

function phoneBox() {  // a new phone number, with the password
  const [pb, ph] = phoneField('newPhone'), [wb, pw] = password('oldPw', 'current-password');
  const say = el('p', {className: 'say', role: 'alert'});
  const go = el('button', {className: 'btn sm', type: 'submit', textContent: t('chPh')});

    e.preventDefault();
    const done = busy(go);
    try {
      const r = await call('mephone', {token, phone: ph.value, password: pw.value});
      if (r.status === 'ok') { UI.toast(t('phChanged')); data.phone = r.phone; return draw(data); }
      if (r.status === 'login') return signOut();
      say.textContent = said(r, {wrong: 'wrongPw', badphone: 'badphone', taken: 'takenP'});
    } catch (e2) { /* toast shown */ }

function emailBox() {  // a new email, with the password; it counts once the code sent there is typed back
  const [eb, em] = emailField('newEmail'), [wb, pw] = password('oldPw', 'current-password');
  const [cb, code] = input('code', {dir: 'ltr', inputMode: 'numeric', autocomplete: 'one-time-code', maxLength: 6, placeholder: '••••••', className: 'code'});
  cb.hidden = true;
  const say = el('p', {className: 'say', role: 'alert'});
  const go = el('button', {className: 'btn sm', type: 'submit', textContent: t('chEm')});
  const f = el('form', {className: 'stack', noValidate: true}, eb, wb, cb, go, say);
  f.onsubmit = async e => {
    e.preventDefault();
    const done = busy(go);
    try {
      const r = cb.hidden ? await call('meemail', {token, email: em.value, password: pw.value}) : await call('meemailok', {token, code: code.value});
      if (r.status === 'login') return signOut();
      if (r.status === 'sent') {
        eb.hidden = wb.hidden = true; cb.hidden = false;
        go.textContent = t('confirm'); say.textContent = t('emCode'); code.focus();
      } else if (r.status === 'ok') { UI.toast(t('emChanged')); data.email = r.email; return draw(data); }
      else say.textContent = cb.hidden ? said(r, {wrong: 'wrongPw', bademail: 'bademail', emailtaken: 'emailtaken', wait: 'wait', busy: 'busy'})
        : t({wrong: 'wrong', emailtaken: 'emailtaken'}[r.status] || 'expired');
    } catch (e2) { /* toast shown */ }
    done();
  };
  return f;
}

function accountBox() {  // the account's own settings: its phone, its email, its password, and deleting it
  const [ob, old] = password('oldPw', 'current-password'), [nb, pw] = password('newPw', 'new-password');
  const say = el('p', {className: 'say', role: 'alert'});
  const go = el('button', {className: 'btn sm', type: 'submit', textContent: t('chPw')});
  const f = el('form', {className: 'stack', noValidate: true}, ob, nb, go, say);
  f.onsubmit = async e => {
    e.preventDefault();
    if (pw.value.length < 8) { say.textContent = t('short'); return pw.focus(); }
    const done = busy(go);
    try {
      const r = await call('mepassword', {token, old: old.value, password: pw.value});
      if (r.status === 'ok') { if (r.token) keep(r.token); UI.toast(t('pwChanged')); old.value = pw.value = ''; say.textContent = ''; }
      else if (r.status === 'login') return signOut();
      else say.textContent = t(r.status === 'short' ? 'short' : 'wrongPw');
    } catch (e2) { /* toast shown */ }
    done();
  };
  const del = btn('del', async () => {
    const p = prompt(t('delAsk'));
    if (!p) return;
    try {
      const r = await call('medelete', {token, password: p});
      if (r.status === 'ok') { UI.toast(t('deleted')); return signOut(); }
      UI.toast(t(r.status === 'login' ? 'ended' : 'wrongPw'));
    } catch (e2) { /* toast shown */ }
  }, true);
  del.classList.add('sm', 'danger');
  const subs = [['chPh', 'phone', phoneBox()], ['chEm', 'mail', emailBox()], ['chPw', 'lock', f],
    ['del', 'trash', el('div', {className: 'stack'}, el('p', {className: 'hint', textContent: t('delD')}), el('div', {}, del))]].map(([k, ico, body]) =>
    el('details', {className: 'sub' + (k === 'del' ? ' danger' : '')},
      el('summary', {}, icon('sico', ICON[ico]), el('span', {className: 'lbl', textContent: t(k)}), icon('chev', ICON.chev)), el('div', {className: 'body'}, body)));
  subs.forEach(d => d.addEventListener('toggle', () => {  // opening one closes the others
    if (d.open) subs.forEach(o => { if (o !== d) o.open = false; });
  }));
  return fold('accBox', t('accT'), t('accS'), 'user', el('div', {className: 'subs'}, subs));
}

function draw(j) {
  const live = j.certs.filter(c => !c.revoked && c.link);
  const text = [t('listHead')(j.name), ...live.map(c => `«${c.activity}» (${c.serial}): ${c.link}`)].join('\n');
  const zip = btn('zip', async () => {
    const done = busy(zip);
    zip.textContent = t('zipping');
    try {
      const r = await call('mezip', {token});
      if (r.status === 'ok') {
        const bytes = Uint8Array.from(atob(r.data), ch => ch.charCodeAt(0));
        const a = el('a', {href: URL.createObjectURL(new Blob([bytes], {type: 'application/zip'})), download: 'certificates.zip'});
        document.body.append(a); a.click(); a.remove();
        if (r.files < live.length) UI.toast(t('zipPart')(r.files), 5000);
      } else UI.toast(t('zipFail'));
    } catch (e) { /* toast shown */ }
    zip.textContent = t('zip');
    done();
  });
  const copy = btn('copyAll', async () => {
    try { await navigator.clipboard.writeText(text); UI.toast(t('copied')); } catch (e) { prompt('', text); }
  }, true);
  const out = btn('out', signOut, true);
  out.classList.add('sm');
  const summary = el('section', {className: 'card pad rise'},
    el('div', {className: 'who'}, el('h2', {dir: 'auto', textContent: j.name}), out),
    el('div', {className: 'meta', style: 'margin-top:6px'},
      el('span', {className: 'ltr', textContent: j.phone}), el('span', {className: 'ltr', textContent: j.email}),
      el('span', {textContent: j.certs.length ? t('count')(live.length) : t('none')})),
    live.length ? el('div', {className: 'btns', style: 'margin-top:14px'}, zip, copy,
      navigator.share ? btn('share', () => navigator.share({text}).catch(() => {}), true) : null) : null);
  const cards = j.certs.map(c => el('article', {className: 'card cert rise' + (c.revoked ? ' off' : '')},
    el('div', {className: 'row'}, el('h3', {dir: 'auto', textContent: c.activity}),
      el('span', {className: 'badge' + (c.revoked ? ' err' : ' ok'), dir: 'auto', textContent: c.revoked ? t('revoked') : c.type || t('cert')})),
    el('div', {className: 'facts'},
      [c.dates, c.org].some(Boolean) ? el('span', {dir: 'auto', textContent: [c.dates, c.org].filter(Boolean).join(' · ')}) : null,
      el('span', {}, t('serial') + ': ', el('span', {className: 'serial ltr', textContent: c.serial})),
      c.code ? el('span', {}, t('vcode') + ': ', el('span', {className: 'codev ltr', textContent: c.code})) : null,
      c.added ? el('span', {className: 'hint', textContent: t('addedB')}) : null),
    c.revoked ? null : el('div', {className: 'btns'},
      /^https:\/\//.test(c.link) ? el('a', {className: 'btn sm', href: c.link, target: '_blank', rel: 'noopener', textContent: t('download')}) : null,
      el('a', {className: 'btn sm ghost', href: verifyUrl(c), target: '_blank', rel: 'noopener', textContent: t('verify')}))));
  show(summary, j.card ? cardBox(j) : null, ...[certList(j.certs, cards)].flat(), el('div', {className: 'duo'}, addBox(), accountBox()));
}

let find = {q: '', type: '', year: ''};  // the list's search and filters, kept when the page is drawn again
const norm = s => String(s || '').toLowerCase().normalize('NFKD').replace(/[\u064B-\u065F\u0670\u0640\u0300-\u036f]/g, '')
  .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');  // «الأستاذة» finds «الاستاذه»
function yearOf(c) {  // as core.serial_year: '2026' (CDCUE-2026-P0010), '2025/2026' (CDCUE-252601-0001), else the year in its dates
  const seg = String(c.serial || '').split('-')[1] || '';
  if (/^20\d\d$/.test(seg)) return seg;
  if (/^\d{6}$/.test(seg)) return `20${seg.slice(0, 2)}/20${seg.slice(2, 4)}`;
  return (String(c.dates || '').match(/20\d\d/) || [''])[0];
}

function certList(certs, cards) {  // the certificates; from 4 of them, a search box, their types and their years to narrow them
  if (!cards.length) return el('div', {className: 'card empty', style: 'margin-top:16px', textContent: t('none')});
  const list = el('div', {className: 'list'}, ...cards);
  if (cards.length < 4) return list;
  const typeOf = c => c.type || t('cert'), keys = certs.map(c => norm([c.activity, c.serial, c.org, typeOf(c), c.dates, c.code].join(' ')));
  const years = certs.map(yearOf), types = new Map(), ys = [...new Set(years.filter(Boolean))].sort().reverse();
  certs.forEach(c => types.set(typeOf(c), (types.get(typeOf(c)) || 0) + 1));
  if (!types.has(find.type)) find.type = '';
  if (!ys.includes(find.year)) find.year = '';
  const q = el('input', {type: 'search', value: find.q, placeholder: t('findPh'), ariaLabel: t('findPh'), autocomplete: 'off', spellcheck: false});
  const chips = el('div', {className: 'chips', role: 'group', ariaLabel: t('lType')},
    [['', t('allTypes'), certs.length], ...[...types].map(([k, n]) => [k, k, n])].map(([v, label, n]) =>
      el('button', {type: 'button', className: 'chip', dir: 'auto', dataset: {v}, onclick: () => { find.type = v; run(); }}, label, el('i', {textContent: n}))));
  const yr = ys.length > 1 ? el('select', {ariaLabel: t('lYear'), onchange: () => { find.year = yr.value; run(); }},
    el('option', {value: '', textContent: t('allYears')}), ys.map(y => el('option', {value: y, textContent: y}))) : null;
  if (yr) yr.value = find.year;
  const found = el('span', {ariaLive: 'polite'}), none = el('div', {className: 'card empty', style: 'margin-top:16px', textContent: t('noMatch')});
  const clear = el('button', {type: 'button', className: 'linkbtn', textContent: t('clear'), onclick: () => {
    find = {q: '', type: '', year: ''}; q.value = ''; if (yr) yr.value = ''; run(); q.focus();
  }});
  function run() {
    const words = norm(find.q).split(/\s+/).filter(Boolean);
    let n = 0;
    cards.forEach((a, i) => {
      const ok = (!find.type || typeOf(certs[i]) === find.type) && (!find.year || years[i] === find.year) && words.every(w => keys[i].includes(w));
      a.hidden = !ok; n += ok;
    });
    chips.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === find.type)));
    const on = words.length || find.type || find.year;
    found.textContent = on ? t('shown')(n, cards.length) : t('count')(cards.length);
    clear.hidden = !on; none.hidden = n > 0;
  }
  q.oninput = () => { find.q = q.value; run(); };
  run();
  return [el('section', {className: 'card finder rise'}, el('div', {className: 'field'}, icon('', ICON.search), q),
    types.size > 1 || yr ? el('div', {className: 'frow'}, types.size > 1 ? chips : null, yr) : null, el('div', {className: 'found'}, found, clear)), list, none];
}

function cardBox(j) {  // the account's own card, as a picture (the dashboard draws the same): shown here, saved or shared from here
  const pic = el('img', {className: 'cardpic', alt: t('cardT') + ' — ' + j.name}), box = el('div');
  let png = null;
  const draw = async () => {
    if (!window.qrcode) await new Promise((ok, bad) => document.head.append(el('script', {src: 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', onload: ok, onerror: bad})));
    const c = await UI.cardCanvas({code: j.card, name: j.name, rows: [[t('lEmail'), j.email], [t('lPhone'), j.phone], [t('lNum'), j.number],
      [t('lCerts'), j.certs.length ? String(j.certs.filter(x => !x.revoked).length) : '']]});
    pic.src = c.toDataURL('image/png');
    png = await new Promise(ok => c.toBlob(ok, 'image/png'));
  };
  const file = () => new File([png], 'card-' + j.card + '.png', {type: 'image/png'});
  const save = () => {
    if (!png) return;
    el('a', {href: pic.src, download: file().name}).click();
    box.replaceChildren(el('p', {className: 'hint', textContent: t('cardHold')}));
  };
  const share = navigator.canShare && navigator.canShare({files: [new File([''], 'x.png', {type: 'image/png'})]})
    ? btn('cardShare', () => png && navigator.share({files: [file()], title: t('cardT')}).catch(() => {}), true) : null;
  const d = fold('cardBox', t('cardT'), t('cardS'), 'card', pic, el('p', {className: 'hint', textContent: t('cardD')}),
    el('div', {className: 'btns'}, btn('cardPrint', save), share), box);
  let drawn = false;
  const open = () => { if (d.open && !drawn) { drawn = true; draw().catch(() => box.replaceChildren(el('p', {className: 'ltr', textContent: j.card}))); } };
  d.addEventListener('toggle', open);
  open();  // drawn the first time it is opened, not with every visit
  return d;
}

UI.init({page: 'me', name: 'title', T, onLang: () => view()});
token ? mine() : signIn();
